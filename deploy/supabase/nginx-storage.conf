# Serves a self-hosted Supabase's Storage *reads* on the site's own domain, so
# the images and attachment links the backend hands out load in the browser
# while the rest of Supabase stays on 127.0.0.1 (docs/self-hosting-supabase.md).
#
# Only two prefixes are exposed, and neither needs an API key:
#   /storage/v1/object/public/  objects in public buckets (blog images, brand assets)
#   /storage/v1/object/sign/    time-limited signed links (support attachments)
# Uploads, listing and deletes stay unreachable from outside.
#
# Install: copy to /etc/nginx/snippets/ and add, inside the HTTPS server block
# of the site file, next to the other include:
#
#   include snippets/alytic-supabase-storage.conf;
#
# then `sudo nginx -t && sudo systemctl reload nginx`. Set the backend's
# SUPABASE_STORAGE_PUBLIC_URL to that site's origin (e.g. https://egxpert.com).

location /storage/v1/object/public/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Set-Cookie;
    expires 7d;
}

location /storage/v1/object/sign/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Set-Cookie;
}
