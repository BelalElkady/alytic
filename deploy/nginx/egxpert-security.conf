# Security rules for the egxpert.com server block. Not a standalone file: it is
# pulled into the server block with
#
#     include snippets/egxpert-security.conf;
#
# so a certbot-managed site file needs one added line instead of a hand merge,
# and updating these rules later is just replacing this file.
#
# Install it with deploy/nginx/install.sh, which also installs
# egxpert-limits.conf (the request-rate zones this file uses, which are only
# valid in the http context).

# Don't advertise the nginx version in headers or error pages.
server_tokens off;

# Slow-client (slowloris) limits: a connection that dribbles its headers or
# body is dropped instead of holding a worker for minutes.
client_header_timeout 15s;
client_body_timeout 30s;
limit_conn egx_conn 40;

# Dotfiles (.env, .git, .htaccess) are never served, whatever ends up on disk.
# .well-known stays reachable: certbot answers its challenges from there.
location ~ /\.(?!well-known) { return 404; }

# The cron triggers are called over loopback by the deploy host's own jobs (see
# .github/workflows) and must never be reachable from the internet. The
# frontend proxy refuses them too; this stops them one hop earlier.
location ^~ /api/public/api/cron/ { return 404; }

# Password guessing, sign-up and mail-triggering endpoints get a request-rate
# cap per client address on top of the app's own limiters.
location ~ ^/api/public/api/auth/(login|register|google|forgot-password|reset-password|resend-verification|verify)$ {
    limit_req zone=egx_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else under /api, capped per client address with room for a page
# load that fans out into a dozen calls.
location /api/ {
    limit_req zone=egx_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
