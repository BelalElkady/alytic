# Reverse proxy for egxpert.com / www.egxpert.com -> the EGXpert frontend
# (Nitro/TanStack Start, systemd unit alytic-frontend.service, port 8080).
#
# The frontend itself proxies everything under /api/public/* to the Express
# backend on 127.0.0.1:3000 (see frontend/src/routes/api/public/$.ts) — so
# nginx only ever needs to know about one upstream. Don't add a second
# location block for the backend; it would bypass that internal proxy and
# its cookie/error handling.
#
# Install at /etc/nginx/sites-available/egxpert.com, symlink into
# sites-enabled, then run `certbot --nginx -d egxpert.com -d www.egxpert.com`
# — certbot rewrites this file in place to add the certificate + the
# HTTP->HTTPS redirect.
#
# The security rules (rate limits, blocked paths, slow-client timeouts) live in
# egxpert-security.conf and are pulled in by the `include` line below. On a
# server certbot has already rewritten, run deploy/nginx/install.sh instead of
# copying this file over: it adds that one line to the existing file.

server {
    listen 80;
    listen [::]:80;
    server_name egxpert.com www.egxpert.com;

    # The portfolio-screenshot import (POST /api/portfolio/import-screenshot)
    # accepts images up to 8MB (see backend/src/api/server.js) — nginx's 1MB
    # default would reject those with a 413 before the app ever sees them.
    client_max_body_size 10m;

    # AI review / market-analysis calls can run long (structured output with
    # retries, web search, multi-turn tool loops) — nginx's 60s default read
    # timeout can 504 a request the backend would have finished.
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    include snippets/egxpert-security.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
