# Reverse proxy for egxpert.com / www.egxpert.com -> the EGXpert frontend
# (Nitro/TanStack Start, systemd unit alytic-frontend.service, port 8080).
#
# The frontend itself proxies everything under /api/public/* to the Express
# backend on 127.0.0.1:3000 (see frontend/src/routes/api/public/$.ts) — so
# nginx only ever needs to know about one upstream. Don't add a second
# location block for the backend; it would bypass that internal proxy and
# its cookie/error handling.
#
# Install at /etc/nginx/sites-available/egxpert.com, symlink into
# sites-enabled, then run `certbot --nginx -d egxpert.com -d www.egxpert.com`
# — certbot rewrites this file in place to add the certificate + the
# HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name egxpert.com www.egxpert.com;

    # The portfolio-screenshot import (POST /api/portfolio/import-screenshot)
    # accepts images up to 8MB (see backend/src/api/server.js) — nginx's 1MB
    # default would reject those with a 413 before the app ever sees them.
    client_max_body_size 10m;

    # Don't advertise the nginx version in headers or error pages.
    server_tokens off;

    # Slow-client (slowloris) limits: a connection that dribbles its headers or
    # body is dropped instead of holding a worker for minutes.
    client_header_timeout 15s;
    client_body_timeout 30s;
    limit_conn egx_conn 40;

    # Dotfiles (.env, .git, .htaccess) are never served, whatever ends up on disk.
    # .well-known stays reachable: certbot answers its challenges from there.
    location ~ /\.(?!well-known) { return 404; }

    # The cron triggers are called over loopback by the deploy host's own jobs
    # (see .github/workflows) and must never be reachable from the internet.
    # The frontend proxy refuses them too; this stops them one hop earlier.
    location ^~ /api/public/api/cron/ { return 404; }

    # Password guessing, sign-up and mail-triggering endpoints get a request
    # rate cap per client address on top of the app's own limiters. The zones
    # are defined in egxpert-limits.conf (http context).
    location ~ ^/api/public/api/auth/(login|register|google|forgot-password|reset-password|resend-verification|verify)$ {
        limit_req zone=egx_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI review / market-analysis calls can run long (structured output with
    # retries, web search, multi-turn tool loops) — nginx's 60s default read
    # timeout can 504 a request the backend would have finished.
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location /api/ {
        limit_req zone=egx_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
