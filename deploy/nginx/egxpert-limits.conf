# Request-rate and connection limits for egxpert.com. These directives are only
# valid in nginx's http context, so this file goes in /etc/nginx/conf.d/ (which
# the stock nginx.conf includes inside http { }), not in sites-available.
#
#   sudo cp deploy/nginx/egxpert-limits.conf /etc/nginx/conf.d/egxpert-limits.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Keyed by client address ($binary_remote_addr). Mobile carriers put many real
# users behind one address, so the numbers are a cap on scripts, not on crowds.

# Sign-in, sign-up and mail-triggering endpoints: 30 requests a minute per address.
limit_req_zone $binary_remote_addr zone=egx_auth:10m rate=30r/m;

# Everything else under /api: 20 requests a second per address, with a burst
# allowance for a page load that fans out into a dozen calls.
limit_req_zone $binary_remote_addr zone=egx_api:10m rate=20r/s;

# Simultaneous connections per address.
limit_conn_zone $binary_remote_addr zone=egx_conn:10m;
