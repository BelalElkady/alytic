<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مكتب المحفظة — البورصة المصرية</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316202E'/%3E%3Cpath d='M7 22l5-9 4 6 3-4 6 7z' fill='%2310b981'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* Palette and shapes carried over from the original egx-desk: a near-black
   summary bar over an off-white ground, 2xl-radius cards, tabular figures.
   Hand-written rather than Tailwind so the page stays one readable file. */
    :root {
      --ink: #16202E;
      --bg: #f4f6f8;
      --card: #fff;
      --line: #e6eaef;
      --line-soft: #f1f5f9;
      --s400: #94a3b8;
      --s500: #64748b;
      --s700: #334155;
      --s800: #1e293b;
      --em50: #ecfdf5;
      --em100: #d1fae5;
      --em500: #10b981;
      --em700: #047857;
      --em900: #064e3b;
      --ro50: #fff1f2;
      --ro100: #ffe4e6;
      --ro600: #e11d48;
      --ro700: #be123c;
      --ro900: #881337;
      --am50: #fffbeb;
      --am100: #fef3c7;
      --am900: #78350f;
      --sky50: #f0f9ff;
      --sky950: #082f49;
      --ind600: #4f46e5;
      --cy600: #0891b2;
      --cy700: #0e7490;
      --vi600: #7c3aed;
      --vi700: #6d28d9;
      --rail-loss: #f0c7c1;
      --rail-mid: #d9dee6;
      --rail-gain: #cfe9da;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, Segoe UI, Tahoma, sans-serif;
      font-size: 14px;
      line-height: 1.5
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum"
    }

    h1,
    h2 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit
    }

    main {
      max-width: 1020px;
      margin: 0 auto;
      padding: 14px
    }

    /* ── header ─────────────────────────────────────────────── */
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap
    }

    .title {
      font-size: 20px;
      font-weight: 700
    }

    .date {
      font-size: 12px;
      color: var(--s500);
      margin-top: 2px
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    /* ── dark summary bar ───────────────────────────────────── */
    .hero {
      background: var(--ink);
      color: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 14px
    }

    .hero .k {
      font-size: 11px;
      color: #94a3b8
    }

    .hero .v {
      font-size: 21px;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: -.3px
    }

    .hero .sub {
      font-size: 10.5px;
      color: #7c8798;
      margin-top: 1px
    }

    .hero .g {
      color: #4ade80
    }

    .hero .r {
      color: #fb7185
    }

    /* ── icon tab bar ───────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 6px;
      margin: 12px 0;
      overflow-x: auto
    }

    .tabs button {
      flex: 1;
      min-width: 74px;
      background: none;
      border: 1.5px solid transparent;
      border-radius: 10px;
      padding: 8px 4px;
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--s500);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px
    }

    .tabs button svg {
      width: 17px;
      height: 17px
    }

    .tabs button.active {
      color: var(--ink);
      border-color: var(--line);
      background: #fff;
      box-shadow: 0 1px 2px #0000000d
    }

    .tabs button:hover:not(.active) {
      color: var(--s800)
    }

    /* ── cards & common ─────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px
    }

    .card.hit {
      border-color: var(--ro600)
    }

    .card.near {
      border-color: #fbbf24
    }

    .card-title {
      font-weight: 600;
      margin-bottom: 2px
    }

    .card-sub {
      font-size: 11.5px;
      color: var(--s500);
      margin-bottom: 12px
    }

    .row {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap
    }

    .empty {
      text-align: center;
      color: var(--s500);
      padding: 28px 14px;
      font-size: 12.5px
    }

    .up {
      color: var(--em700)
    }

    .down {
      color: var(--ro700)
    }

    .muted {
      color: var(--s500)
    }

    .warn {
      font-size: 11px;
      color: var(--s400);
      margin-top: 12px
    }

    button.act {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font: inherit;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    button.act:disabled {
      opacity: .5;
      cursor: default
    }

    button.ghost {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 13px;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer
    }

    button.danger {
      background: var(--ro600);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 13px;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer
    }

    input,
    select,
    textarea {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      width: 108px
    }

    textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical
    }

    /* ── alerts ─────────────────────────────────────────────── */
    .alert {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 13.5px;
      margin-bottom: 8px
    }

    .alert i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex: none
    }

    .alert.hit {
      background: var(--ro100);
      color: var(--ro900)
    }

    .alert.near {
      background: var(--am100);
      color: var(--am900)
    }

    .alert.ok {
      background: var(--em100);
      color: var(--em900)
    }

    /* ── tables ─────────────────────────────────────────────── */
    .scroll {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px
    }

    th {
      text-align: right;
      font-weight: 500;
      color: var(--s500);
      padding: 0 8px 8px;
      border-bottom: 1px solid var(--line-soft);
      white-space: nowrap;
      font-size: 11px
    }

    td {
      padding: 8px;
      border-bottom: 1px solid var(--line-soft);
      white-space: nowrap
    }

    tbody tr:last-child td {
      border-bottom: 0
    }

    tr.clickable {
      cursor: pointer
    }

    tr.clickable:hover {
      background: #f8fafc
    }

    .est {
      display: inline-block;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 11px
    }

    .e0 {
      background: var(--em100);
      color: var(--em900);
      font-weight: 600
    }

    .e1 {
      background: var(--am50);
      color: var(--am900)
    }

    .e2 {
      background: #f8fafc;
      color: var(--s700)
    }

    .e3 {
      color: var(--s400)
    }

    /* ── position card ──────────────────────────────────────── */
    .pos-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px
    }

    .ticker {
      font-size: 18px;
      font-weight: 700;
      cursor: pointer
    }

    .badge {
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap
    }

    .b-hold {
      background: #f1f5f9;
      color: var(--s700)
    }

    .b-sell_part {
      background: var(--am100);
      color: var(--am900)
    }

    .b-take_target {
      background: var(--em100);
      color: var(--em900)
    }

    .b-sell_all {
      background: var(--ro100);
      color: var(--ro900)
    }

    .b-exit_stop {
      background: var(--ro600);
      color: #fff
    }

    .b-buy_more {
      background: #e0f2fe;
      color: var(--sky950)
    }

    .pos-meta {
      font-size: 11.5px;
      color: var(--s500);
      margin-top: 2px
    }

    .pos-price {
      text-align: left
    }

    .pos-price .p {
      font-size: 18px;
      font-weight: 600
    }

    .pos-price .d {
      font-size: 11.5px
    }

    .rail {
      position: relative;
      height: 52px;
      margin: 16px 4px 4px
    }

    .rail-bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 20px;
      height: 6px;
      border-radius: 3px
    }

    .rail-tick {
      position: absolute;
      width: 2px;
      transform: translateX(50%)
    }

    .rail-lbl {
      position: absolute;
      transform: translateX(50%);
      white-space: nowrap;
      font-size: 10px;
      line-height: 1.2
    }

    .rail-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      transform: translateX(50%);
      top: 12px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: var(--ink);
      box-shadow: 0 0 0 1.5px var(--ink)
    }

    .stats4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--s500)
    }

    .stats4 b {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--s800);
      margin-top: 1px
    }

    .rec {
      margin-top: 12px;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 13.5px;
      line-height: 1.65
    }

    .rec .when {
      font-size: 11px;
      color: var(--s500)
    }

    .rec .order {
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px
    }

    .r-exit_stop,
    .r-sell_all {
      background: var(--ro50);
      color: #4c0519
    }

    .r-buy_more {
      background: var(--sky50);
      color: var(--sky950)
    }

    .r-hold {
      background: #f8fafc;
      color: var(--s800)
    }

    .r-sell_part,
    .r-take_target {
      background: var(--am50);
      color: #451a03
    }

    /* ── calendar ───────────────────────────────────────────── */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .cal-dow {
      text-align: center;
      font-size: 11px;
      color: var(--s500);
      padding-bottom: 2px
    }

    .cal-day {
      height: 54px;
      border: 1px solid var(--line-soft);
      border-radius: 9px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      gap: 1px
    }

    .cal-day.off {
      background: #f8fafc;
      color: #cbd5e1;
      cursor: default
    }

    .cal-day.up {
      background: var(--em50)
    }

    .cal-day.down {
      background: var(--ro50)
    }

    .cal-day.sel {
      border-color: var(--ink);
      box-shadow: 0 0 0 1px var(--ink)
    }

    .cal-day .pc {
      font-size: 10px;
      font-weight: 600
    }

    /* ── charts ─────────────────────────────────────────────── */
    .chart {
      width: 100%;
      height: 190px;
      display: block
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px
    }

    .bar-row .lbl {
      width: 52px;
      font-weight: 600;
      flex: none
    }

    .bar-track {
      flex: 1;
      height: 18px;
      background: var(--line-soft);
      border-radius: 5px;
      position: relative;
      overflow: hidden
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 5px
    }

    .bar-val {
      width: 64px;
      text-align: left;
      flex: none
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #0f172acc;
      display: none;
      z-index: 50;
      overflow-y: auto;
      padding: 22px
    }

    .overlay.show {
      display: block
    }

    .modal {
      background: var(--card);
      border-radius: 16px;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative
    }

    .close {
      position: absolute;
      left: 14px;
      top: 12px;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--s400);
      cursor: pointer;
      line-height: 1
    }

    .lvl {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px dashed var(--line-soft);
      font-size: 12.5px
    }

    .bullets {
      margin: 5px 0 0;
      padding-inline-start: 17px;
      font-size: 12.5px
    }

    .spin {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #ffffff55;
      border-top-color: #fff;
      border-radius: 50%;
      animation: sp .7s linear infinite;
      vertical-align: -1px
    }

    .spin.dark {
      border-color: var(--line);
      border-top-color: var(--ink)
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }

    @media (max-width:640px) {
      .stats4 {
        grid-template-columns: repeat(2, 1fr)
      }

      main {
        padding: 10px
      }

      .hero .v {
        font-size: 18px
      }
    }

    /* Account shell and theme */
    body.dark {
      --ink: #e5edf7;
      --bg: #0b1220;
      --card: #121c2b;
      --line: #26364a;
      --line-soft: #1d2b3d;
      --s400: #7f91a8;
      --s500: #9aaac0;
      --s700: #c3cfdd;
      --s800: #e5edf7;
      --em50: #12352f;
      --em100: #17483c;
      --em700: #6ee7b7;
      --em900: #a7f3d0;
      --ro50: #3b1823;
      --ro100: #51202e;
      --ro700: #fda4af;
      --ro900: #fecdd3;
      --am50: #3a2b0c;
      --am100: #55400e;
      --am900: #fde68a;
      --sky50: #102d44;
      --sky950: #bae6fd
    }

    body.dark input,
    body.dark select,
    body.dark textarea {
      background: #0d1725;
      color: var(--ink)
    }

    body.dark .tabs button.active,
    body.dark .ghost,
    body.dark .cal-day,
    body.dark tr.clickable:hover {
      background: #182638;
      color: var(--ink)
    }

    body.dark .cal-day.off {
      background: #0f1928;
      color: #52647b
    }

    body.dark .e2,
    body.dark .r-hold {
      background: var(--line-soft);
      color: var(--s700)
    }

    body.dark .b-hold {
      background: var(--line);
      color: var(--s700)
    }

    body.dark .b-buy_more {
      background: var(--sky50);
      color: var(--sky950)
    }

    body.dark .r-exit_stop,
    body.dark .r-sell_all {
      color: var(--ro900)
    }

    body.dark .r-sell_part,
    body.dark .r-take_target {
      color: var(--am900)
    }

    body.dark .rail-dot {
      border-color: var(--card)
    }

    body.dark .hero {
      background: #121c2b;
      color: #e5edf7;
      border: 1px solid var(--line)
    }

    body.dark .hero .k {
      color: #b7c5d6
    }

    body.dark .hero .sub {
      color: #9aaac0
    }

    body.dark button.act {
      background: #26364a;
      color: #f4f8fc;
      border: 1px solid #3b506a
    }

    #auth-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at 20% 10%, #16364b 0, #0b1220 42%, #070b12 100%)
    }

    #auth-screen[hidden] {
      display: none
    }

    .auth-card {
      width: min(430px, 100%);
      background: #121c2b;
      color: #e5edf7;
      border: 1px solid #26364a;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 80px #0008
    }

    .auth-brand {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px
    }

    .auth-sub {
      color: #9aaac0;
      margin-bottom: 22px
    }

    .auth-card label {
      display: block;
      color: #c3cfdd;
      font-size: 12px;
      margin: 12px 0 5px
    }

    .auth-card input {
      width: 100%;
      background: #0d1725;
      color: #e5edf7;
      border-color: #30435c
    }

    .auth-card .act {
      width: 100%;
      justify-content: center;
      margin-top: 18px
    }

    .auth-switch {
      color: #9aaac0;
      text-align: center;
      margin: 18px 0 0;
      font-size: 12px
    }

    .auth-switch button {
      background: none;
      border: 0;
      color: #6ee7b7;
      font: inherit;
      cursor: pointer
    }

    .auth-error {
      color: #fda4af;
      font-size: 12px;
      min-height: 18px;
      margin-top: 10px
    }

    .market-results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px
    }

    .market-row {
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px;
      background: var(--card)
    }

    .market-row.held {
      border-color: var(--em500)
    }

    .market-row-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px
    }

    .market-score {
      font-size: 16px;
      font-weight: 700
    }

    .market-meta {
      font-size: 11px;
      color: var(--s500);
      margin-top: 3px
    }

    .market-action {
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px
    }

    .market-action.buy {
      color: var(--em700)
    }

    .market-action.wait {
      color: var(--am900)
    }

    .market-action.avoid {
      color: var(--ro700)
    }

    .market-summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--s500);
      margin-top: 8px
    }

    .market-targets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      font-size: 11px
    }

    .market-target {
      background: var(--line-soft);
      border-radius: 7px;
      padding: 6px
    }

    .market-target b {
      display: block;
      font-size: 13px;
      color: var(--em700)
    }

    .market-buy-plan {
      margin-top: 8px;
      padding: 7px;
      border-radius: 7px;
      background: var(--em50);
      color: var(--em900);
      font-size: 11px
    }

    @media (max-width:640px) {
      .market-results {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <section id="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">Alytic</div>
      <div class="auth-sub">مساحتك الخاصة لمتابعة الأسهم والأداء</div>
      <form id="auth-form">
        <label id="auth-name-label" hidden>الاسم</label>
        <input id="auth-name" type="text" autocomplete="name" placeholder="اسمك" hidden>
        <label>البريد الإلكتروني</label>
        <input id="auth-email" type="email" autocomplete="email" required placeholder="name@example.com">
        <label>كلمة المرور</label>
        <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required
          placeholder="8 حروف على الأقل">
        <div class="auth-error" id="auth-error"></div>
        <button class="act" id="auth-submit" type="submit">دخول</button>
      </form>
      <div class="auth-switch"><span id="auth-switch-text">لسه جديد؟</span> <button id="auth-switch" type="button">إنشاء
          حساب</button></div>
    </div>
  </section>
  <main id="app" hidden>
    <div class="top">
      <div>
        <h1 class="title">مكتب المحفظة</h1>
        <div class="date" id="today-date"></div>
        <div class="date" id="price-refresh">تحديث الأسعار: —</div>
      </div>
      <div class="top-actions">
        <span class="muted" id="user-label" style="align-self:center;font-size:12px"></span>
        <button class="ghost" id="btn-theme" title="تبديل الوضع">الوضع الداكن</button>
        <button class="ghost" id="btn-upload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z" />
            <circle cx="12" cy="13" r="3.5" />
          </svg>
          رفع صور المحفظة
        </button>
        <input id="wallet-file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <button class="ghost" id="btn-logout">خروج</button>
        <button class="ghost" id="btn-manual">إدخال يدوي</button>
        <button class="act" id="btn-market-analyzer">حلل السوق</button>
        <button class="act" id="btn-snapshot">سجّل إغلاق اليوم</button>
      </div>
    </div>

    <div class="hero" id="hero"></div>

    <div class="tabs" id="tabs"></div>

    <section id="tab-positions"></section>
    <section id="tab-targets" hidden></section>
    <section id="tab-calendar" hidden></section>
    <section id="tab-charts" hidden></section>
    <section id="tab-cash" hidden></section>
    <section id="tab-trades" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script type="module">
    const $ = (s) => document.querySelector(s);
    const fmt = (n, d = 2) => (n == null || Number.isNaN(n) ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }));
    const int = (n) => (n == null ? '—' : Math.round(n).toLocaleString('en-US'));
    const pct = (n, d = 2) => (n == null ? '—' : `${n > 0 ? '+' : ''}${Number(n).toFixed(d)}%`);
    // Money always carries an explicit sign — parentheses are accounting notation
    // for a negative, so "(5,620)" on a gain reads as a loss.
    const signed = (n) => (n == null ? '—' : `${n > 0 ? '+' : n < 0 ? '−' : ''}${Math.abs(Math.round(n)).toLocaleString('en-US')}`);
    const cls = (n) => (n == null ? '' : n > 0 ? 'up' : n < 0 ? 'down' : '');
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const iso = (d) => d.toLocaleDateString('en-CA', { timeZone: 'Africa/Cairo' });

    async function api(path, opts) {
      const res = await fetch(path, opts);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);
      return body;
    }
    const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });

    const AUTH = { register: false, user: null };
    const setAuthMode = (registerMode) => {
      AUTH.register = registerMode;
      $('#auth-name-label').hidden = !registerMode;
      $('#auth-name').hidden = !registerMode;
      $('#auth-name').required = registerMode;
      $('#auth-password').autocomplete = registerMode ? 'new-password' : 'current-password';
      $('#auth-submit').textContent = registerMode ? 'إنشاء الحساب' : 'دخول';
      $('#auth-switch-text').textContent = registerMode ? 'عندك حساب؟' : 'لسه جديد؟';
      $('#auth-switch').textContent = registerMode ? 'تسجيل الدخول' : 'إنشاء حساب';
      $('#auth-error').textContent = '';
    };

    $('#auth-switch').onclick = () => setAuthMode(!AUTH.register);
    $('#auth-form').onsubmit = async (event) => {
      event.preventDefault();
      const button = $('#auth-submit');
      button.disabled = true;
      try {
        const body = { email: $('#auth-email').value, password: $('#auth-password').value };
        if (AUTH.register) body.name = $('#auth-name').value;
        const result = await post(AUTH.register ? '/api/auth/register' : '/api/auth/login', body);
        await enterApp(result.user);
      } catch (error) {
        $('#auth-error').textContent = error.message;
      } finally { button.disabled = false; }
    };

    async function enterApp(user) {
      AUTH.user = user;
      $('#user-label').textContent = user.name || user.email;
      $('#auth-screen').hidden = true;
      $('#app').hidden = false;
      // Loaded once, up front — this is what the stock-picker fields in the
      // trades and cash tabs draw from, so a code can only ever be one the
      // engine can actually track (see the note in portfolio.js recordTrade).
      try {
        const { stocks } = await api('/api/universe');
        S.universe = [...stocks].sort((a, b) => a.code.localeCompare(b.code));
      } catch { S.universe = []; }
      await loadAll();
      startPriceRefresh();
    }

    $('#btn-logout').onclick = async () => {
      await post('/api/auth/logout');
      location.reload();
    };

    const savedTheme = localStorage.getItem('alytic-theme');
    if (savedTheme === 'dark') document.body.classList.add('dark');
    const syncThemeLabel = () => { $('#btn-theme').textContent = document.body.classList.contains('dark') ? 'الوضع الفاتح' : 'الوضع الداكن'; };
    syncThemeLabel();
    $('#btn-theme').onclick = () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('alytic-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
      syncThemeLabel();
    };

    $('#btn-upload').onclick = () => $('#wallet-file').click();
    $('#wallet-file').onchange = async () => {
      const files = [...$('#wallet-file').files];
      if (!files.length) return;
      // Default to merging — a screenshot of one stock's page must only ever
      // touch that one stock. Full replacement (clearing positions the new
      // image doesn't mention) is destructive, so it takes an explicit yes.
      const replaceAll = confirm(
        'لو الصورة (أو الصور) دي بتمثل المحفظة كاملة وعايز تستبدل كل الأسهم الحالية بيها: دوس "موافق".\n\n' +
        'لو دي صورة سهم واحد أو أكتر بس، وعايز تضيفه/تحدّثه من غير ما تمسح باقي الأسهم: دوس "إلغاء".',
      );
      const button = $('#btn-upload');
      button.disabled = true;
      button.textContent = `بيقرأ ${files.length} صورة…`;
      try {
        let derived = 0;
        let imported = 0;
        for (const [index, file] of files.entries()) {
          const mode = replaceAll && index === 0 ? 'replace=1' : 'merge=1';
          const result = await api(`/api/portfolio/import-screenshot?${mode}`, { method: 'POST', headers: { 'Content-Type': file.type }, body: file });
          derived += result.derivedPositions ?? 0;
          imported += result.positions ?? 0;
        }
        await loadAll();
        // Never report a silent success when share counts were back-solved
        // rather than read — that is exactly how a guessed number ends up
        // being trusted as a real holding.
        const scopeNote = replaceAll ? 'استُبدلت المحفظة بالكامل.' : 'اتضاف/اتحدّث الأسهم دي بس — باقي المحفظة زي ما هو.';
        alert(derived
          ? `تم تحديث ${imported} سهم من ${files.length} صورة. ${scopeNote}\n\n⚠️ ${derived} منهم عدد الأسهم فيه ما كانش ظاهر في الصورة، فاتحسب تقديريًا (القيمة السوقية ÷ آخر سعر مقفول) — يعني ممكن يكون غلط.\nراجع الأرقام دي وصححها من «إدخال يدوي».`
          : `تم تحديث ${imported} سهم من ${files.length} صورة. ${scopeNote} سجل الصفقات والأداء السابق محفوظ.`);
      } catch (error) { alert(error.message); }
      finally { button.disabled = false; button.textContent = 'رفع صور المحفظة'; $('#wallet-file').value = ''; }
    };

    $('#today-date').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    // ── state ────────────────────────────────────────────────
    const S = { pf: null, rows: [], log: {}, scan: [], selectedDay: iso(new Date()), calMonth: new Date(), activeTab: 'positions', universe: [] };
    let priceRefreshTimer = null;

    // ── tab bar ──────────────────────────────────────────────
    const ICONS = {
      positions: '<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
      targets: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
      charts: '<path d="M3 20h18M6 16l4-5 3 3 5-7"/>',
      cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
      trades: '<path d="M7 7h13l-3-3M17 17H4l3 3"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15a2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 3.6V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 16.1 4.6l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 20.4 11H21a2 2 0 1 1 0 4z"/>',
    };
    const TABS = [
      ['positions', 'الأسهم'], ['targets', 'الأهداف'], ['calendar', 'التقويم'], ['charts', 'الرسوم'],
      ['cash', 'الكاش'], ['trades', 'الصفقات'], ['settings', 'الإعدادات'],
    ];
    $('#tabs').innerHTML = TABS.map(([k, l], i) =>
      `<button data-tab="${k}" class="${i === 0 ? 'active' : ''}">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>
     ${l}</button>`).join('');

    document.querySelectorAll('#tabs button').forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('active', x === b));
        for (const [k] of TABS) $(`#tab-${k}`).hidden = k !== b.dataset.tab;
        S.activeTab = b.dataset.tab;
        RENDER[b.dataset.tab]?.();
        refreshPrices(); // rate-limited — a no-op if the last poll was recent
      };
    });

    // ── the price rail ───────────────────────────────────────
    // `stop`/`target` are the medium-term (tactical) pair — what the mechanical
    // rules actually enforce on a session close. `longStop`/`longTarget` are the
    // long-horizon pair (6–18 months): a deliberately wider stop tied to the
    // 200-day average (see computeLongTermStop) and the long-range target.
    // Showing all four together answers "exit the swing, or hold for the bigger
    // move — and at what point would I be wrong either way?" without opening
    // the detail modal.
    function rail({ stop, cost, target, longStop, longTarget, price }) {
      const loCandidates = [stop, cost, price, longStop].filter((v) => v != null);
      const hiCandidates = [target, longTarget, price].filter((v) => v != null);
      const lo = Math.min(...loCandidates) * 0.96;
      const hi = Math.max(...hiCandidates) * 1.04;
      const at = (v) => `${(((v - lo) / (hi - lo)) * 100).toFixed(1)}%`;
      const p = (v) => ((v - lo) / (hi - lo)) * 100;

      const marks = [
        { v: stop, label: `وقف ${fmt(stop)}`, color: 'var(--ind600)', text: 'color:#3730a3;font-weight:600', side: 'bot' },
        { v: cost, label: `شراء ${fmt(cost)}`, color: 'var(--s400)', text: 'color:#64748b', side: 'top' },
      ];
      if (target) marks.push({ v: target, label: `هدف متوسط ${fmt(target)}`, color: 'var(--em500)', text: 'color:#047857', side: 'bot' });
      // Only worth a separate mark when it's actually further out than the
      // medium target — otherwise the two labels collide on the same point.
      if (longTarget && (!target || longTarget > target * 1.01)) {
        marks.push({ v: longTarget, label: `هدف بعيد ${fmt(longTarget)}`, color: 'var(--cy600)', text: 'color:var(--cy700);font-weight:600', side: 'top' });
      }
      // Same logic in the other direction: a long-term stop only earns its own
      // mark when it's actually wider than the tactical one (computeLongTermStop
      // already guarantees it's never tighter, so "equal" is the only overlap case).
      if (longStop && (!stop || longStop < stop * 0.99)) {
        marks.push({ v: longStop, label: `وقف بعيد ${fmt(longStop)}`, color: 'var(--vi600)', text: 'color:var(--vi700);font-weight:600', side: 'top' });
      }

      // Two ticks on the same side within ~10% of the rail's width read as one
      // smudge rather than two labels — nudge the later one to the other side.
      for (const side of ['top', 'bot']) {
        const onSide = marks.filter((m) => m.side === side);
        for (let i = 0; i < onSide.length - 1; i++) {
          for (let j = i + 1; j < onSide.length; j++) {
            if (Math.abs(p(onSide[i].v) - p(onSide[j].v)) < 10) onSide[j].side = side === 'top' ? 'bot' : 'top';
          }
        }
      }

      // Below the stop is always red. The grey "underwater" band only exists while
      // the stop sits below cost — once a trailing stop ratchets past the entry the
      // position is fully protected and there is no underwater zone left. Emitting
      // the stops in the wrong order yields a malformed gradient.
      const bar = p(cost) > p(stop)
        ? `var(--rail-loss) 0%,var(--rail-loss) ${at(stop)},var(--rail-mid) ${at(stop)},var(--rail-mid) ${at(cost)},var(--rail-gain) ${at(cost)},var(--rail-gain) 100%`
        : `var(--rail-loss) 0%,var(--rail-loss) ${at(stop)},var(--rail-gain) ${at(stop)},var(--rail-gain) 100%`;

      return `<div class="rail"><div class="rail-bar" style="background:linear-gradient(to right,${bar})"></div>
    ${marks.map((m) => `<div class="rail-tick" style="left:${at(m.v)};background:${m.color};top:${m.side === 'top' ? '8px' : '20px'};height:12px"></div>
      <div class="rail-lbl num" style="left:${at(m.v)};top:${m.side === 'top' ? '0' : '34px'};${m.text}">${m.label}</div>`).join('')}
    <div class="rail-dot" style="left:${at(price)}"></div></div>`;
    }

    // ── stock picker ─────────────────────────────────────────
    // A constrained "list of all stocks to choose from" rather than free text.
    // Free text used to accept anything — a mistyped ticker, a company name, a
    // Yahoo-style ".CA" suffix — and the trade would report success while the
    // resulting position could never be priced, so it never showed up anywhere
    // in the app. A <select> makes that class of mistake structurally
    // impossible: every value it can hold is one the engine can actually track.
    function stockOptionsHTML(list) {
      return list.map((s) => `<option value="${s.code}">${esc(s.code)} — ${esc(s.ar || s.en)}</option>`).join('');
    }

    /** Renders the select. `id` becomes the element's id. */
    function stockPickerHTML(id, { width = '230px' } = {}) {
      return `<select id="${id}" style="width:${width}"><option value="" disabled selected>اختار السهم…</option>${stockOptionsHTML(S.universe)}</select>`;
    }

    // ── data load ────────────────────────────────────────────
    async function loadAll() {
      S.pf = await api('/api/portfolio');
      const codes = Object.keys(S.pf.positions);
      S.rows = codes.length ? (await api(`/api/scan?codes=${codes.join(',')}`)).results.filter((r) => r.position) : [];
      S.log = (await api('/api/log')).log;
      renderHero();
      RENDER.positions();
    }

    // Prices refresh live in the background — no page reload needed. 20s is
    // frequent enough to feel current for an intraday desk without hammering
    // TradingView's undocumented quote socket (see tv-history.js): a single
    // solo-user app polling every 20s is a light, steady load, not a burst.
    const PRICE_REFRESH_MS = 20 * 1000;
    let lastRefreshAt = 0;

    async function refreshPrices({ force = false } = {}) {
      if (!AUTH.user || document.hidden || !S.rows.length) return;
      // Guards against overlapping calls when a tab switch and the interval
      // tick land close together — never fetch twice within one cycle.
      if (!force && Date.now() - lastRefreshAt < PRICE_REFRESH_MS - 1000) return;
      lastRefreshAt = Date.now();
      try {
        const codes = S.rows.map((row) => row.code).join(',');
        const { quotes } = await api(`/api/quotes?codes=${encodeURIComponent(codes)}`);
        S.rows = S.rows.map((row) => {
          const quote = quotes[row.code];
          if (!quote?.price) return row;
          const position = row.position
            ? { ...row.position, marketValue: +(row.position.shares * quote.price).toFixed(2), unrealizedEgp: +(row.position.shares * (quote.price - row.position.avgCost)).toFixed(2), unrealizedPct: +(((quote.price - row.position.avgCost) / row.position.avgCost) * 100).toFixed(2) }
            : row.position;
          return { ...row, price: quote.price, lastTradePrice: quote.price, lastTradeTime: quote.time, changePct: quote.changePct ?? row.changePct, position };
        });
        $('#price-refresh').textContent = `تحديث الأسعار: ${new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
        patchLivePrices();
      } catch (error) {
        $('#price-refresh').textContent = 'تعذر تحديث الأسعار';
      }
    }

    /**
     * Applies a price tick to the DOM without rebuilding anything but the
     * numbers that actually changed.
     *
     * The previous approach called `RENDER[S.activeTab]?.()`, which rebuilds
     * that tab's entire innerHTML from scratch every 20 seconds. For a
     * read-only tab that's a visible flicker and a lost scroll position; on
     * the trades or watchlist forms it silently erased whatever the user was
     * mid-typing, since those inputs live inside the very subtree being
     * replaced. This instead locates each already-rendered card or row by its
     * `data-code` and swaps only that element's markup — every other node on
     * the page, including any open form, is left completely alone. Tabs with
     * no live per-stock display (trades/cash/calendar/settings/charts) are
     * skipped entirely; they pick up the refreshed S.rows next time the user
     * actually opens them.
     */
    function patchLivePrices() {
      renderHero();

      if (S.activeTab === 'positions') {
        const alertsEl = $('#alerts-region');
        if (alertsEl) alertsEl.innerHTML = alertsHTML();
        for (const r of S.rows) {
          const cardEl = document.querySelector(`#cards-region .card[data-code="${CSS.escape(r.code)}"]`);
          if (cardEl) cardEl.outerHTML = positionCard(r);
        }
        wireCodeClicks('#tab-positions');
      }

      if (S.activeTab === 'targets') {
        for (const r of S.rows) {
          // Row order is deliberately left as-is on a live tick — re-sorting
          // out from under someone mid-glance would be its own small version
          // of the same "the whole thing just moved" problem. The table
          // re-sorts correctly the next time RENDER.targets() runs in full,
          // e.g. on returning to the tab.
          const e = r.position.estimate;
          const targetRow = document.querySelector(`#targets-tbody tr[data-code="${CSS.escape(r.code)}"]`);
          if (targetRow && e) targetRow.outerHTML = targetRowHTML(r, e);
          const levelsRow = document.querySelector(`#levels-tbody tr[data-code="${CSS.escape(r.code)}"]`);
          if (levelsRow) levelsRow.outerHTML = levelsRowHTML(r);
        }
        wireCodeClicks('#tab-targets');
      }
    }

    function startPriceRefresh() {
      if (priceRefreshTimer) clearInterval(priceRefreshTimer);
      priceRefreshTimer = setInterval(refreshPrices, PRICE_REFRESH_MS);
    }

    // A background tab is exempt above (no point polling what nobody sees),
    // so catch up the moment the user comes back to it instead of leaving
    // them looking at a stale price until the next scheduled tick.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshPrices({ force: true });
    });

    function totals() {
      const cost = S.rows.reduce((a, r) => a + r.position.shares * r.position.avgCost, 0);
      const value = S.rows.reduce((a, r) => a + r.position.marketValue, 0);
      const pl = value - cost;
      const day = S.rows.reduce((a, r) => a + (r.position.shares * r.price * (r.changePct ?? 0)) / 100, 0);
      return { cost, value, pl, plPct: cost ? (pl / cost) * 100 : 0, day, cash: S.pf?.cash ?? 0 };
    }

    function renderHero() {
      const t = totals();
      const hasDay = S.rows.some((r) => r.changePct != null);
      $('#hero').innerHTML = `
    <div><div class="k">التكلفة الكلية</div><div class="v num">${int(t.cost)}</div></div>
    <div><div class="k">قيمة الأسهم</div><div class="v num">${int(t.value)}</div></div>
    <div><div class="k">ربح/خسارة من الشراء</div>
      <div class="v num ${t.pl >= 0 ? 'g' : 'r'}">${signed(t.pl)}</div>
      <div class="sub num ${t.pl >= 0 ? 'g' : 'r'}">(${pct(t.plPct)})</div></div>
    <div><div class="k">تغيّر اليوم</div>
      <div class="v num ${t.day >= 0 ? 'g' : 'r'}">${hasDay ? signed(t.day) : '—'}</div></div>
    <div><div class="k">الكاش</div><div class="v num">${int(t.cash)}</div>
      <div class="sub num">إجمالي ${int(t.value + t.cash)} ج</div></div>`;
    }

    // ── shared: targets table ────────────────────────────────
    const estClass = (w) => (w <= 2 ? 'e0' : w <= 6 ? 'e1' : w <= 16 ? 'e2' : 'e3');

    // A price tick must be able to refresh ONE row without touching the rest
    // of the table (or re-sorting it mid-glance) — factored out so both the
    // full render and the surgical patch in patchLivePrices() share one
    // definition and can never drift apart.
    function targetRowHTML(r, e) {
      return `<tr class="clickable" data-code="${r.code}">
        <td><div style="font-weight:600">${r.code}</div><div style="font-size:11px;color:var(--s400)">${esc(r.sector ?? '')}</div></td>
        <td class="num">${fmt(r.price)}</td>
        <td class="num up" style="font-weight:500">${r.midTarget ? fmt(r.midTarget.price) : '—'}</td>
        <td class="num" style="font-weight:600;color:var(--s800)">${e.reached ? '—' : pct(e.distancePct, 1)}</td>
        <td class="num ${cls(r.changePct)}" style="font-weight:500">${r.changePct != null ? pct(r.changePct) : '—'}</td>
        <td><span class="est ${estClass(e.weeks)}">${esc(e.label)}</span>${e.note ? `<span style="margin-inline-start:5px;font-size:10px;color:var(--s400)">${esc(e.note)}</span>` : ''}</td>
      </tr>`;
    }

    function targetsTable() {
      const rows = S.rows
        .map((r) => ({ r, e: r.position.estimate }))
        .filter(({ e }) => e)
        .sort((a, b) => (a.e.distancePct ?? 0) - (b.e.distancePct ?? 0));

      if (!rows.length) return '<div class="empty">مفيش أهداف محسوبة — سجّل مراكز الأول.</div>';

      return `<div class="scroll"><table>
    <thead><tr><th>السهم</th><th>الحالي</th><th>الهدف</th><th>المسافة</th><th>اليوم</th><th>التقدير الزمني</th></tr></thead>
    <tbody id="targets-tbody">${rows.map(({ r, e }) => targetRowHTML(r, e)).join('')}</tbody></table></div>
    <p class="warn">⚠️ التقديرات الزمنية تقريبية بناءً على سرعة السهم وزخمه — مش ضمان. أي كسر للوقف يلغي الهدف.</p>`;
    }

    // ── RENDER: الأسهم ───────────────────────────────────────
    const RENDER = {};

    function alertsHTML() {
      const alerts = S.rows.map((r) => {
        const p = r.position;
        if (p.stopBreached) return { k: 'hit', t: `${r.code}: أغلق تحت وقف الخسارة ${fmt(p.stop)} — خروج` };
        if ((p.distanceToStopPct ?? 99) <= 3) return { k: 'near', t: `${r.code}: قريب من الوقف (${fmt(p.distanceToStopPct, 1)}%)` };
        if (p.triggers?.atTarget) return { k: 'ok', t: `${r.code}: وصل الهدف ${fmt(r.midTarget?.price)}` };
        return null;
      }).filter(Boolean);
      return (alerts.length ? alerts : [{ k: 'ok', t: 'لا توجد تنبيهات — كل الأسهم داخل نطاقها.' }])
        .map((a) => `<div class="alert ${a.k}"><i></i>${esc(a.t)}</div>`).join('');
    }

    RENDER.positions = () => {
      if (!S.rows.length) {
        $('#tab-positions').innerHTML = `<div class="card"><div class="empty">
      مفيش مراكز مفتوحة. سجّل أول صفقة من تبويب «الصفقات».</div></div>`;
        return;
      }
      $('#tab-positions').innerHTML =
        `<div id="alerts-region">${alertsHTML()}</div>` +
        `<div id="cards-region">${S.rows.map(positionCard).join('')}</div>`;
      wireCodeClicks('#tab-positions');
    };

    function positionCard(r) {
      const p = r.position;
      // An older server build without `recommendation` must not blank the desk.
      const rec = p.recommendation ?? { action: 'hold', label: 'احتفاظ', text: 'التوصية مش متاحة — أعد تشغيل الخادم.', order: null };
      const state = p.stopBreached ? 'hit' : (p.distanceToStopPct ?? 99) <= 3 ? 'near' : '';
      return `<div class="card ${state}" data-code="${r.code}">
    <div class="pos-head">
      <div>
        <div class="row" style="gap:8px">
          <span class="ticker" data-code="${r.code}">${r.code}</span>
          <span class="badge b-${rec.action}">${esc(rec.label)}</span>
        </div>
        <div class="pos-meta">${esc(r.name)} · <span class="num">${int(p.shares)}</span> سهم @ <span class="num">${fmt(p.avgCost)}</span>${p.sharesEstimated ? ` <span class="badge b-sell_part" title="اتحسب من القيمة السوقية ÷ آخر سعر مقفول، مش مقروء من الصورة">⚠️ عدد تقديري</span>` : ''}</div>
      </div>
      <div class="pos-price">
        <div class="p num">${fmt(r.price)}</div>
        <div class="d num ${cls(r.changePct)}">${r.changePct != null ? pct(r.changePct) + ' اليوم' : ''}</div>
      </div>
    </div>
    ${rail({ stop: p.stop, cost: p.avgCost, target: r.midTarget?.price, longStop: p.longTermStop?.stop, longTarget: r.longTarget?.price, price: r.price })}
    <div class="stats4">
      <div>القيمة<b class="num">${int(p.marketValue)}</b></div>
      <div>الربح<b class="num ${cls(p.unrealizedEgp)}">${signed(p.unrealizedEgp)} <span style="font-size:11px">(${pct(p.unrealizedPct, 1)})</span></b></div>
      <div>للوقف<b class="num" style="${(p.distanceToStopPct ?? 99) <= 3 ? 'color:var(--ro700)' : ''}">${pct(p.distanceToStopPct, 1)}</b></div>
      <div>للهدف<b class="num">${r.midTarget ? pct(((r.midTarget.price - r.price) / r.price) * 100, 1) : '—'}</b></div>
    </div>
    <div class="rec r-${rec.action}">
      <span class="when">توصية اليوم · </span>${esc(rec.text)}
      ${rec.order ? `<div class="order num" dir="rtl">الأمر: ${rec.order.side === 'buy' ? 'شراء' : 'بيع'} ${int(rec.order.qty)} سهم عند ${fmt(rec.order.price)} ≈ ${int(rec.order.qty * rec.order.price)} ج</div>` : ''}
    </div></div>`;
    }

    function wireCodeClicks(scope) {
      document.querySelectorAll(`${scope} [data-code]`).forEach((el) => { el.onclick = () => showDetail(el.dataset.code); });
    }

    // ── RENDER: الأهداف ──────────────────────────────────────
    function levelsRowHTML(r) {
      return `<tr class="clickable" data-code="${r.code}">
          <td><b>${r.code}</b></td>
          <td class="num down">${fmt(r.position.stop)}</td>
          <td class="num">${fmt(r.price)}</td>
          <td class="num up">${r.midTarget ? fmt(r.midTarget.price) : '—'}</td>
          <td class="num up">${r.longTarget?.price ? fmt(r.longTarget.price) : '—'}</td>
          <td class="num">${r.position.riskRewardFromHere ?? '—'}</td></tr>`;
    }

    RENDER.targets = () => {
      $('#tab-targets').innerHTML = `<div class="card">
      <div class="card-title">⏱ جدول الأهداف</div>
      <div class="card-sub">مرتب من الأقرب للأبعد. التقدير الزمني بيتحدث مع كل إغلاق جديد.</div>
      ${targetsTable()}</div>` +
        (S.rows.length ? `<div class="card"><div class="card-title">المستويات لكل سهم</div>
      <div class="card-sub">الوقف والهدف المتوسط والبعيد كما يحسبهم المحرك.</div>
      <div class="scroll"><table>
        <thead><tr><th>السهم</th><th>الوقف</th><th>الحالي</th><th>هدف متوسط</th><th>هدف بعيد</th><th>ع/م</th></tr></thead>
        <tbody id="levels-tbody">${S.rows.map(levelsRowHTML).join('')}</tbody>
      </table></div></div>` : '');
      wireCodeClicks('#tab-targets');
    };

    // ── RENDER: التقويم ──────────────────────────────────────
    const DOW = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];

    RENDER.calendar = () => {
      const m = S.calMonth;
      const first = new Date(m.getFullYear(), m.getMonth(), 1);
      const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      const pad = first.getDay();
      const cells = [...Array(pad).fill(null), ...Array.from({ length: days }, (_, i) => iso(new Date(m.getFullYear(), m.getMonth(), i + 1)))];

      const entry = S.log[S.selectedDay];
      const monthLabel = m.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });

      $('#tab-calendar').innerHTML = `
    <div class="card">
      <div class="cal-head">
        <button class="ghost" id="cal-prev">‹ السابق</button>
        <div style="font-weight:600">${monthLabel}</div>
        <button class="ghost" id="cal-next">التالي ›</button>
      </div>
      <div class="cal-grid">${DOW.map((d) => `<div class="cal-dow">${d}</div>`).join('')}</div>
      <div class="cal-grid" style="margin-top:4px">${cells.map((d) => {
        if (!d) return '<div></div>';
        const dow = new Date(`${d}T12:00:00`).getDay();
        const weekend = dow === 5 || dow === 6;   // EGX trades Sun–Thu
        const e = S.log[d];
        const tone = weekend ? 'off' : e ? (e.dayChange >= 0 ? 'up' : 'down') : '';
        return `<div class="cal-day ${tone} ${d === S.selectedDay ? 'sel' : ''}" data-day="${d}">
          <span class="num">${+d.slice(-2)}</span>
          ${e ? `<span class="pc num ${e.dayChange >= 0 ? 'up' : 'down'}">${pct(e.dayChangePct, 1)}</span>` : ''}</div>`;
      }).join('')}</div>
    </div>
    <div class="card">
      <div class="card-title">${new Date(`${S.selectedDay}T12:00:00`).toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
      ${entry ? `
        <div class="stats4" style="grid-template-columns:repeat(3,1fr)">
          <div>قيمة المحفظة<b class="num">${int(entry.total)}</b></div>
          <div>تغيّر اليوم<b class="num ${cls(entry.dayChange)}">${signed(entry.dayChange)}</b></div>
          <div>إجمالي الربح<b class="num ${cls(entry.pl)}">${signed(entry.pl)}</b></div>
        </div>
        ${entry.changes?.length ? `<div class="rec r-buy_more" style="margin-top:12px"><b>تعديلات الوقف/الهدف:</b>
          <ul class="bullets">${entry.changes.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
        <div class="scroll" style="margin-top:12px"><table>
          <thead><tr><th>السهم</th><th>إغلاق</th><th>الوقف</th><th>التوصية</th></tr></thead>
          <tbody>${Object.entries(entry.prices).map(([c, p]) => `<tr>
            <td><b>${c}</b></td><td class="num">${fmt(p)}</td>
            <td class="num down">${fmt(entry.stops?.[c])}</td>
            <td class="muted" style="white-space:normal">${esc(entry.recs?.[c]?.text ?? '—')}</td></tr>`).join('')}</tbody>
        </table></div>
        <div style="margin-top:12px">
          <div class="card-sub" style="margin-bottom:5px">ملاحظة اليوم</div>
          <textarea id="day-note" placeholder="اكتب ملاحظتك عن اليوم…">${esc(entry.note ?? '')}</textarea>
          <button class="act" id="save-note" style="margin-top:8px">حفظ الملاحظة</button>
          <span class="muted" id="note-msg" style="margin-inline-start:8px;font-size:12px"></span>
        </div>`
          : `<div class="empty">مفيش بيانات محفوظة لهذا اليوم.<br>اضغط «سجّل إغلاق اليوم» فوق عشان تبدأ السجل.</div>`}
    </div>`;

      $('#cal-prev').onclick = () => { S.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); RENDER.calendar(); };
      $('#cal-next').onclick = () => { S.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); RENDER.calendar(); };
      document.querySelectorAll('#tab-calendar .cal-day[data-day]').forEach((el) => {
        el.onclick = () => { S.selectedDay = el.dataset.day; RENDER.calendar(); };
      });
      const save = $('#save-note');
      if (save) save.onclick = async () => {
        await post('/api/log/note', { date: S.selectedDay, note: $('#day-note').value });
        S.log = (await api('/api/log')).log;
        $('#note-msg').textContent = 'تم الحفظ ✓';
      };
    };

    // ── RENDER: الرسوم ───────────────────────────────────────
    RENDER.charts = () => {
      const days = Object.keys(S.log).sort();
      const series = days.map((d) => ({ d, v: S.log[d].total }));

      // 1. equity curve
      let equity;
      if (series.length < 2) {
        equity = `<div class="empty">محتاج يومين محفوظين على الأقل لرسم الخط.<br>
      <button class="act" id="backfill" style="margin-top:10px">ابنِ السجل من أسعار السوق التاريخية</button></div>`;
      } else {
        const W = 640, H = 170, P = 26;
        const vals = series.map((s) => s.v);
        const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
        const x = (i) => P + (i * (W - P * 2)) / (series.length - 1);
        const y = (v) => H - P - ((v - lo) / span) * (H - P * 2);
        const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s.v).toFixed(1)}`).join(' ');
        const rising = series.at(-1).v >= series[0].v;
        // direction:ltr is required — the page is RTL, and SVG text inherits it, so
        // `text-anchor="end"` anchors from the wrong side and the axis labels run
        // off-canvas leaving only their first glyph visible ("214,416" renders "2").
        equity = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="direction:ltr">
      <polyline points="${pts}" fill="none" stroke="${rising ? 'var(--em500)' : 'var(--ro600)'}" stroke-width="2" stroke-linejoin="round"/>
      ${series.map((s, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(s.v).toFixed(1)}" r="2.5" fill="${rising ? 'var(--em500)' : 'var(--ro600)'}"/>`).join('')}
      <text x="${W - 4}" y="12" text-anchor="end" font-size="10" fill="#94a3b8">${int(hi)}</text>
      <text x="${W - 4}" y="${H - 4}" text-anchor="end" font-size="10" fill="#94a3b8">${int(lo)}</text>
    </svg>
    <div class="muted" style="font-size:11px">من ${days[0]} إلى ${days.at(-1)} · ${days.length} يوم محفوظ</div>`;
      }

      // 2. per-stock P/L bars
      const maxAbs = Math.max(1, ...S.rows.map((r) => Math.abs(r.position.unrealizedPct)));
      const bars = S.rows.length ? [...S.rows].sort((a, b) => b.position.unrealizedPct - a.position.unrealizedPct).map((r) => {
        const v = r.position.unrealizedPct;
        return `<div class="bar-row"><div class="lbl">${r.code}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(Math.abs(v) / maxAbs) * 100}%;
        ${v >= 0 ? 'right:0;background:var(--em500)' : 'left:0;background:var(--ro600)'}"></div></div>
      <div class="bar-val num ${cls(v)}">${pct(v, 1)}</div></div>`;
      }).join('') : '<div class="empty">مفيش مراكز.</div>';

      // 3. price vs stop/target — the same rail, compact
      const rails = S.rows.length ? S.rows.map((r) => `<div style="margin-bottom:4px">
      <div class="row" style="gap:6px"><b style="font-size:12.5px">${r.code}</b>
        <span class="muted" style="font-size:11px">${esc(r.name)}</span></div>
      ${rail({ stop: r.position.stop, cost: r.position.avgCost, target: r.midTarget?.price, longStop: r.position.longTermStop?.stop, longTarget: r.longTarget?.price, price: r.price })}
    </div>`).join('') : '<div class="empty">مفيش مراكز.</div>';

      $('#tab-charts').innerHTML = `
    <div class="card"><div class="card-title">قيمة المحفظة يوم بيوم</div>
      <div class="card-sub">كل نقطة = إغلاق يوم محفوظ. الخط الصاعد يعني المحفظة بتكبر.</div>${equity}</div>
    <div class="card"><div class="card-title">ربح/خسارة كل سهم من الشراء (%)</div>
      <div class="card-sub">أخضر = مكسب، أحمر = خسارة. الأطول = الأبعد عن سعر شراءك.</div>${bars}</div>
    <div class="card"><div class="card-title">سعر السهم مقابل الوقف والهدف</div>
      <div class="card-sub">الأزرق = وقف الخسارة الأساسي، البنفسجي = وقف بعيد (متوسط 200 يوم — للي محتفظ على المدى الطويل)، الأخضر = الهدف المتوسط، السماوي = الهدف البعيد، الرمادي = سعر شراءك. لو النقطة قربت من الأزرق، خلي بالك.</div>${rails}</div>`;

      const bf = $('#backfill');
      if (bf) bf.onclick = async () => {
        bf.disabled = true; bf.innerHTML = '<span class="spin"></span> بيبني…';
        try {
          const r = await post('/api/log/backfill', { days: 90 });
          S.log = (await api('/api/log')).log;
          RENDER.charts();
          // Say plainly what this curve is, so it is never mistaken for a real
          // record of what the book was worth on those days.
          $('#tab-charts').insertAdjacentHTML('afterbegin',
            `<div class="alert near"><i></i>اتبنى ${r.added} يوم من أسعار السوق الحقيقية (${r.from} → ${r.to}) —
         محسوبة على عدد الأسهم اللي معاك دلوقتي، يعني "كانت هتساوي كام"، مش سجل فعلي.</div>`);
        } catch (e) { bf.disabled = false; bf.textContent = e.message; }
      };
    };

    // ── RENDER: الكاش ────────────────────────────────────────
    RENDER.cash = () => {
      const t = totals();
      const share = t.value + t.cash ? (t.cash / (t.value + t.cash)) * 100 : 0;
      const watch = Object.entries(S.pf?.watchlist ?? {});

      const advice = t.cash <= 0
        ? 'مفيش كاش متاح حاليًا. أي شراء جديد لازم يجي من بيع جزئي لسهم مربح — ما تشتريش بالدين.'
        : share < 10
          ? `الكاش ${fmt(share, 0)}% بس من المحفظة — قليل. احتفظ به كاحتياطي، وما تدخلش صفقة جديدة إلا لو اتنفذ أمر من قائمة المراقبة عند سعره المحدد.`
          : share < 30
            ? `الكاش ${fmt(share, 0)}% — نسبة صحية. وزّعه: ثلث على أوامر محددة، وثلث ينتظر تصحيح المؤشر، وثلث يفضل نقدي.`
            : `الكاش ${fmt(share, 0)}% — عالي. ابدأ نشر تدريجي على 3 أسابيع بأوامر محددة. الباقي صندوق نقدي — مش فلوس نايمة، ده عائد + ذخيرة.`;

      $('#tab-cash').innerHTML = `
    <div class="card">
      <div class="card-title">الكاش المتاح</div>
      <div class="card-sub">حدّثه لما تحوّل فلوس أو تسحب. البيع والشراء من تبويب الصفقات بيعدّلوه أوتوماتيك.</div>
      <div class="row"><input id="cash-in" type="number" placeholder="المبلغ" value="${t.cash}">
        <button class="act" id="cash-save">حفظ</button>
        <span class="muted" id="cash-msg" style="font-size:12px"></span></div>
      <div class="stats4" style="grid-template-columns:repeat(4,1fr);margin-top:14px">
        <div>نسبة الكاش من الإجمالي<b class="num">${fmt(share, 1)}%</b></div>
        <div>التكلفة الكلية<b class="num">${int(t.cost)}</b></div>
        <div>قيمة الأسهم<b class="num">${int(t.value)}</b></div>
        <div>إجمالي رأس المال<b class="num">${int(t.value + t.cash)}</b></div>
      </div>
      <div class="rec r-hold" style="margin-top:12px">${esc(advice)}</div>
      <button class="act" id="btn-cash-analyzer" style="margin-top:12px">حلل استخدام الكاش</button>
    </div>
    <div class="card">
      <div class="card-title">قائمة المراقبة — أسهم مقترحة للكاش</div>
      <div class="card-sub">أوامر شراء محددة على مستويات دعم، مش بسعر السوق. لو اتنفذ أمر، سجّله في الصفقات وهيتحوّل لمركز.</div>
      <div class="row" style="margin-bottom:12px">
        ${stockPickerHTML('w-code')}
        <input id="w-entry" type="number" step="0.01" placeholder="سعر الدخول">
        <input id="w-stop" type="number" step="0.01" placeholder="الوقف">
        <input id="w-target" type="number" step="0.01" placeholder="الهدف">
        <input id="w-qty" type="number" placeholder="العدد">
        <button class="act" id="w-add">إضافة</button>
      </div>
      <div class="muted" id="watchlist-msg" style="font-size:12px;margin-bottom:10px"></div>
      ${watch.length ? `<div class="scroll"><table>
        <thead><tr><th>الكود</th><th>سعر الدخول</th><th>الوقف</th><th>الهدف</th><th>العدد</th><th>التكلفة</th><th>مخاطرة</th><th>عائد 1:</th><th></th></tr></thead>
        <tbody>${watch.map(([c, w]) => {
        const risk = w.entry && w.stop ? ((w.entry - w.stop) / w.entry) * 100 : null;
        const rr = w.entry && w.stop && w.target ? (w.target - w.entry) / (w.entry - w.stop) : null;
        return `<tr><td><b>${c}</b></td>
            <td class="num">${fmt(w.entry)}</td><td class="num down">${fmt(w.stop)}</td><td class="num up">${fmt(w.target)}</td>
            <td class="num">${int(w.qty)}</td><td class="num">${w.entry && w.qty ? int(w.entry * w.qty) : '—'}</td>
            <td class="num">${risk != null ? fmt(risk, 1) + '%' : '—'}</td>
            <td class="num">${rr != null ? fmt(rr, 1) : '—'}</td>
            <td><button class="ghost w-del" data-code="${c}" style="padding:3px 8px;font-size:11px">حذف</button></td></tr>`;
      }).join('')}</tbody></table></div>` : '<div class="empty">قائمة المراقبة فاضية.</div>'}
    </div>`;

      $('#cash-save').onclick = async () => {
        await post('/api/portfolio/cash', { cash: +$('#cash-in').value });
        S.pf = await api('/api/portfolio'); $('#cash-msg').textContent = 'تم تحديث الكاش ✓'; renderHero();
      };
      $('#btn-cash-analyzer').onclick = () => runMarketAnalyzer('cash');
      $('#w-add').onclick = async () => {
        const code = $('#w-code').value;
        if (!code) { $('#watchlist-msg').textContent = 'اختار سهم من القائمة الأول.'; return; }
        try {
          await post('/api/portfolio/watchlist', { code, entry: +$('#w-entry').value, stop: +$('#w-stop').value, target: +$('#w-target').value, qty: +$('#w-qty').value });
          S.pf = await api('/api/portfolio'); RENDER.cash();
        } catch (e) { $('#watchlist-msg').textContent = e.message; }
      };
      document.querySelectorAll('.w-del').forEach((b) => {
        b.onclick = async () => { await post('/api/portfolio/watchlist', { code: b.dataset.code, remove: true }); S.pf = await api('/api/portfolio'); RENDER.cash(); };
      });
    };

    // ── RENDER: الصفقات ──────────────────────────────────────
    RENDER.trades = () => {
      const trades = S.pf?.trades ?? [];
      const realized = S.pf?.realizedPnl ?? 0;
      $('#tab-trades').innerHTML = `
    <div class="card">
      <div class="card-title">سجّل صفقة</div>
      <div class="card-sub">أي بيع أو شراء اتنفذ فعليًا. المتوسط والعدد والكاش والتوصيات بتتحدث تلقائيًا.</div>
      <div class="row">
        ${stockPickerHTML('t-code')}
        <select id="t-side" style="width:auto"><option value="buy">شراء</option><option value="sell">بيع</option></select>
        <input id="t-shares" type="number" placeholder="العدد">
        <input id="t-price" type="number" step="0.01" placeholder="سعر التنفيذ">
        <input id="t-date" type="date" style="width:150px">
        <button class="act" id="btn-trade">تسجيل</button>
      </div>
      <div class="muted" id="trade-msg" style="font-size:12px;margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="card-title">سجل الصفقات</div>
        <div class="num ${cls(realized)}" style="font-weight:600">ربح محقق إجمالي: ${signed(realized)} ج</div>
      </div>
      <div class="scroll" style="margin-top:10px"><table>
        <thead><tr><th>التاريخ</th><th>الكود</th><th>النوع</th><th>العدد</th><th>السعر</th><th>عمولة</th><th>محقق</th></tr></thead>
        <tbody>${trades.length ? [...trades].reverse().map((t) => `<tr>
          <td class="num">${t.date}</td><td><b>${t.code}</b></td>
          <td class="${t.side === 'buy' ? 'up' : 'down'}">${t.side === 'buy' ? 'شراء' : 'بيع'}</td>
          <td class="num">${int(t.shares)}</td><td class="num">${fmt(t.price)}</td>
          <td class="num muted">${fmt(t.commission)}</td>
          <td class="num ${cls(t.realized)}">${t.realized != null ? signed(t.realized) : '—'}</td></tr>`).join('')
          : '<tr><td colspan="7" class="empty">لا توجد صفقات مسجلة بعد.</td></tr>'}</tbody>
      </table></div>
    </div>`;

      $('#btn-trade').onclick = async () => {
        const btn = $('#btn-trade');
        if (btn.disabled) return; // already submitting — a fast double-click must not fire twice
        const code = $('#t-code').value;
        if (!code) { $('#trade-msg').textContent = 'اختار سهم من القائمة الأول.'; return; }
        btn.disabled = true;
        try {
          await post('/api/portfolio/trade', {
            code, side: $('#t-side').value,
            shares: +$('#t-shares').value, price: +$('#t-price').value, date: $('#t-date').value || undefined,
          });
          $('#trade-msg').textContent = 'تم تسجيل الصفقة وتحديث المحفظة ✓';
          await loadAll(); RENDER.trades();
        } catch (e) { $('#trade-msg').textContent = e.message; }
        finally { btn.disabled = false; }
      };
    };

    // ── RENDER: الإعدادات ────────────────────────────────────
    RENDER.settings = async () => {
      const { settings, rules } = await api('/api/settings');
      $('#tab-settings').innerHTML = `
    <div class="card">
      <div class="card-title">عمولة الوساطة</div>
      <div class="card-sub">نسبة على كل صفقة (شراء أو بيع). الافتراضي 0.2%.</div>
      <div class="row"><input id="comm" type="number" step="0.01" value="${settings.commissionPct}">
        <button class="act" id="comm-save">حفظ</button>
        <span class="muted" id="comm-msg" style="font-size:12px"></span></div>
    </div>
    <div class="card">
      <div class="card-title">قواعد التوصيات المفعّلة</div>
      <div class="card-sub">أسلوب متوسط المدى — أفق أسابيع لشهور. غيّرها في src/config/rules.js.</div>
      <ul class="bullets">
        <li>وقف متحرك ${rules.trailing.trailPct}% يتفعّل تلقائيًا لما السهم يعلى ${rules.trailing.activateAtProfitPct}% فوق تكلفتك، ولا ينزل أبدًا.</li>
        <li>الوقف يُحترم على إغلاق الجلسة — إغلاق تحته = توصية بيع كلي.</li>
        <li>ربح ${rules.takeProfit.partialAtProfitPct}%+ = توصية بيع جزئي ${rules.takeProfit.partialFraction * 100}% بأمر محدد فوق السعر ${rules.takeProfit.limitAbovePricePct}%.</li>
        <li>وصول الهدف = بيع ثلث ورفع الوقف للباقي.</li>
        <li>تحسين المتوسط فقط للأسهم القيادية فوق متوسط 200 يوم — لا تعديل على سهم ضعيف.</li>
        <li>أقل عائد/مخاطرة مقبول: ${rules.entry.minRiskReward} · المخاطرة للصفقة ${rules.sizing.riskPerTradePct}% · الحد الأقصى للمركز ${rules.sizing.maxPositionPct}%.</li>
      </ul>
    </div>
    <div class="card">
      <div class="card-title">إعادة تعيين</div>
      <div class="card-sub">يمسح السجل اليومي والصفقات. المراكز بتفضل زي ما هي. لا يمكن التراجع.</div>
      <div class="row">
        <button class="danger" id="reset-log">مسح السجل والصفقات</button>
        <span class="muted" id="reset-msg" style="font-size:12px"></span>
      </div>
    </div>`;

      $('#comm-save').onclick = async () => {
        try { await post('/api/settings', { commissionPct: +$('#comm').value }); $('#comm-msg').textContent = 'تم تحديث العمولة ✓'; }
        catch (e) { $('#comm-msg').textContent = e.message; }
      };
      $('#reset-log').onclick = async () => {
        const b = $('#reset-log');
        if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'تأكيد المسح'; $('#reset-msg').textContent = 'اضغط تاني للتأكيد'; return; }
        await post('/api/reset', { scope: 'log' });
        await loadAll(); RENDER.settings();
      };
    };

    // ── market analyzer ──────────────────────────────────────
    const marketAction = (row) => {
      if (row.position) return { label: `موجود عندك · ${row.signal?.ar ?? 'راجع المركز'}`, cls: 'wait' };
      if (row.worthBuyingNow) return { label: 'فرصة قابلة للتنفيذ الآن', cls: 'buy' };
      if (row.entryStatus === 'limit_pullback') return { label: 'استنى تصحيح وأمر محدد', cls: 'wait' };
      if (row.entryStatus === 'too_extended') return { label: 'ممتد — لا تطارد السعر', cls: 'wait' };
      return { label: row.signal?.ar ?? 'استنى', cls: 'avoid' };
    };

    function showMarketResults(data) {
      const rows = [...(data.results ?? [])].sort((a, b) => {
        const aRank = a.worthBuyingNow ? 1 : 0;
        const bRank = b.worthBuyingNow ? 1 : 0;
        return bRank - aRank || (b.score ?? 0) - (a.score ?? 0);
      });
      const actionable = rows.filter((row) => row.worthBuyingNow).length;
      const held = rows.filter((row) => row.position).length;
      const isCashFocus = data.focus === 'cash';
      const shown = isCashFocus ? rows.filter((row) => row.cashPlanSelected) : rows.slice(0, 60);
      $('#overlay').classList.add('show');
      $('#modal').innerHTML = `<button class="close" id="x">×</button>
        <div class="card-title" style="font-size:18px">${isCashFocus ? 'أفضل توزيع للكاش' : 'تحليل السوق'}</div>
        <div class="card-sub">${isCashFocus ? `تم اختيار ${shown.length} أسهم فقط من أقل المخاطر وأعلى الجودة. التوزيع متساوٍ تقريبًا مع احتياطي ${fmt(data.cashPlan?.reserveCash ?? 0)} ج.` : `ترتيب الأسهم حسب التقييم والفرص القابلة للتنفيذ. الفحص شمل ${data.count ?? rows.length} سهم.`}</div>
        <div class="market-summary"><span>الكاش المتاح: <b class="num">${int(data.cash ?? 0)} ج</b></span>${isCashFocus ? `<span>القابل للتوزيع: <b class="num">${int(data.cashPlan?.investableCash ?? 0)} ج</b></span><span>لكل سهم: <b class="num">${int(data.cashPlan?.allocationPerStock ?? 0)} ج</b></span>` : `<span>فرص الآن: <b class="up">${actionable}</b></span>`}<span>مراكزك: <b>${held}</b></span><span>آخر تحديث: ${esc(data.asOf ?? '—')}</span></div>
        <div class="market-results">${shown.map((row) => {
        const action = marketAction(row);
        const heldClass = row.position ? 'held' : '';
        return `<div class="market-row ${heldClass}">
            <div class="market-row-head"><div><b>${esc(row.code)}</b><div class="market-meta">${esc(row.name ?? '')} · ${esc(row.sector ?? '')}</div></div><div class="market-score num">${row.score ?? '—'}<span class="market-meta">/100</span></div></div>
            <div class="market-meta num">السعر ${fmt(row.price)} · اليوم ${pct(row.changePct)} · RSI ${fmt(row.rsi, 1)}</div>
            <div class="market-action ${action.cls}">${action.label}</div>
            <div class="market-targets">
              <div class="market-target"><span>هدف متوسط</span><b class="num">${row.midTarget ? fmt(row.midTarget.price) : '—'}</b><span>${row.midTarget ? `${pct(row.midTarget.upsidePct, 1)} · ${esc(row.midTarget.horizon?.ar ?? '')}` : 'لا يوجد هدف صالح'}</span></div>
              <div class="market-target"><span>هدف بعيد</span><b class="num">${row.longTarget?.price ? fmt(row.longTarget.price) : '—'}</b><span>${row.longTarget?.price ? `${pct(row.longTarget.upsidePct, 1)} · ${esc(row.longTarget.horizon?.ar ?? '')}` : esc(row.longTarget?.note ?? 'لا يوجد هدف بعيد')}</span></div>
            </div>
            <div class="market-meta num">وقف ${fmt(row.stop)} · ع/م ${row.riskRewardNow ?? '—'}</div>
            ${row.midTarget?.basis ? `<div class="market-meta">أساس الهدف: ${esc(row.midTarget.basis)}</div>` : ''}
            ${!row.position && row.buyPlan ? `<div class="market-buy-plan">${row.buyPlan.shares > 0
            ? `الاقتراح: <b>${int(row.buyPlan.shares)} سهم</b> عند <b class="num">${fmt(row.buyPlan.entry)}</b> · التكلفة <b class="num">${int(row.buyPlan.cost)} ج</b> · المتبقي <b class="num">${int(row.buyPlan.cashAfter)} ج</b><br>${esc(row.buyPlan.reason)}`
            : esc(row.buyPlan.reason)}</div>` : ''}
          </div>`;
      }).join('')}</div>
        ${data.errors?.length ? `<div class="warn">تعذر تحليل ${data.errors.length} سهم بسبب نقص البيانات.</div>` : ''}`;
      $('#x').onclick = () => $('#overlay').classList.remove('show');
    }

    async function runMarketAnalyzer(focus = 'market') {
      const button = $('#btn-market-analyzer');
      const original = button.innerHTML;
      button.disabled = true;
      button.innerHTML = `<span class="spin"></span> ${focus === 'cash' ? 'بيختار أفضل توزيع…' : 'بيحلل السوق…'}`;
      $('#overlay').classList.add('show');
      $('#modal').innerHTML = '<div class="empty"><span class="spin dark"></span> بيحلل الأسهم المتاحة، ده ممكن ياخد شوية…</div>';
      try {
        const data = await api(`/api/scan${focus === 'cash' ? '?focus=cash' : ''}`);
        showMarketResults(data);
      } catch (error) {
        $('#modal').innerHTML = `<button class="close" id="x">×</button><div class="empty">${esc(error.message)}</div>`;
        $('#x').onclick = () => $('#overlay').classList.remove('show');
      } finally {
        button.disabled = false;
        button.innerHTML = original;
      }
    }
    $('#btn-market-analyzer').onclick = () => runMarketAnalyzer('market');

    // ── header actions ───────────────────────────────────────
    $('#btn-snapshot').onclick = async () => {
      const b = $('#btn-snapshot'); const html = b.innerHTML;
      b.disabled = true; b.innerHTML = '<span class="spin"></span> بيسجّل…';
      try {
        const r = await post('/api/snapshot');
        S.log = (await api('/api/log')).log;
        S.selectedDay = r.saved;
        b.innerHTML = `تم حفظ إغلاق ${r.saved} ✓`;
        setTimeout(() => { b.innerHTML = html; b.disabled = false; }, 2200);
      } catch (e) { b.innerHTML = html; b.disabled = false; alert(e.message); }
    };

    $('#btn-manual').onclick = () => {
      $('#overlay').classList.add('show');
      const anyEstimated = S.rows.some((r) => r.position.sharesEstimated);
      $('#modal').innerHTML = `<button class="close" id="x">×</button>
    <div class="card-title">إدخال يدوي</div>
    <div class="card-sub">الأسعار بتتحدث تلقائيًا من السوق. استعمل ده لو عايز تصحّح عدد الأسهم أو متوسط الشراء، أو تعدّل وقف وهدف بنفسك.</div>
    ${anyEstimated ? `<div class="alert near" style="margin-bottom:10px"><i></i>
      الأسهم المعلّمة بـ ⚠️ عددها اتحسب تقديريًا من صورة المحفظة (القيمة السوقية ÷ آخر سعر) — صححها من هنا.</div>` : ''}
    ${S.rows.length ? `<div class="scroll"><table>
      <thead><tr><th>السهم</th><th>عدد الأسهم</th><th>متوسط الشراء</th><th>وقف</th><th>هدف</th></tr></thead>
      <tbody>${S.rows.map((r) => `<tr>
        <td><b>${r.code}</b>${r.position.sharesEstimated ? ' <span title="عدد تقديري">⚠️</span>' : ''}</td>
        <td><input type="number" step="1" class="m-shares" data-code="${r.code}" value="${r.position.shares}" style="width:90px"></td>
        <td><input type="number" step="0.0001" class="m-cost" data-code="${r.code}" value="${r.position.avgCost}" style="width:100px"></td>
        <td><input type="number" step="0.01" class="m-stop" data-code="${r.code}" value="${r.position.stop}" style="width:90px"></td>
        <td><input type="number" step="0.01" class="m-tgt" data-code="${r.code}" value="${r.midTarget?.price ?? ''}" style="width:90px"></td>
      </tr>`).join('')}</tbody></table></div>
      <div class="muted" id="m-msg" style="font-size:12px;margin-top:8px"></div>
      <button class="act" id="m-save" style="margin-top:8px">حفظ التعديلات</button>`
          : '<div class="empty">مفيش مراكز.</div>'}`;
      $('#x').onclick = () => $('#overlay').classList.remove('show');
      const save = $('#m-save');
      if (save) save.onclick = async () => {
        save.disabled = true;
        try {
          for (const el of document.querySelectorAll('.m-shares')) {
            const code = el.dataset.code;
            const row = S.rows.find((r) => r.code === code);
            const cost = document.querySelector(`.m-cost[data-code="${CSS.escape(code)}"]`);
            const stop = document.querySelector(`.m-stop[data-code="${CSS.escape(code)}"]`);
            const tgt = document.querySelector(`.m-tgt[data-code="${CSS.escape(code)}"]`);

            // Only write a holding that actually changed — an untouched row
            // shouldn't clear its own "estimated" flag and claim to be confirmed.
            const sharesChanged = +el.value !== row.position.shares;
            const costChanged = +cost.value !== row.position.avgCost;
            if (sharesChanged || costChanged) {
              await post('/api/portfolio/holding', { code, shares: +el.value, avgCost: +cost.value });
            }
            await post('/api/portfolio/levels', { code, stop: +stop.value, target: tgt?.value ? +tgt.value : null });
          }
          $('#overlay').classList.remove('show');
          await loadAll();
        } catch (e) {
          const msg = $('#m-msg');
          if (msg) msg.textContent = e.message;
          save.disabled = false;
        }
      };
    };

    // ── detail modal ─────────────────────────────────────────
    async function showDetail(code) {
      $('#overlay').classList.add('show');
      $('#modal').innerHTML = '<div class="empty"><span class="spin dark"></span> بيحمّل…</div>';
      const close = () => $('#overlay').classList.remove('show');
      try {
        const a = await api(`/api/analyze/${code}`);
        const s = a.snapshot, p = a.plan, t = a.technical, f = a.fundamentals;
        $('#modal').innerHTML = `<button class="close" id="x">×</button>
      <div style="font-size:17px;font-weight:700">${a.code} — ${esc(a.name)}</div>
      <div class="card-sub">${esc(a.sectorAr ?? '')} · إغلاق ${a.asOf}</div>
      <div class="stats4" style="margin:12px 0">
        <div>السعر<b class="num">${fmt(s.price.close)} <span style="font-size:12px" class="${cls(s.price.changePct)}">${pct(s.price.changePct)}</span></b></div>
        <div>التقييم<b class="num">${t.score}<span class="muted" style="font-size:12px">/100 · ${esc(t.signal.ar)}</span></b></div>
        <div>الاتجاه<b style="font-size:13px">${esc(s.trend.label)}</b></div>
        <div>RSI<b class="num">${fmt(s.momentum.rsi14, 1)}</b></div>
      </div>
      ${f ? `<div class="rec r-hold" style="margin-top:0"><b>الأساسيات:</b> ${esc(f.valuation ?? '—')}</div>` : ''}
      <div class="card" style="background:var(--line-soft);margin-top:12px">
        <div class="card-title">الخطة</div>
        <div class="lvl"><span>الدخول</span><span>${esc(p.entryNote)}</span></div>
        <div class="lvl"><span>الوقف</span><span class="num down">${fmt(p.stop.stop)} ج · مخاطرة ${p.stop.riskPct}%</span></div>
        ${p.targets.mid ? `<div class="lvl"><span>الهدف المتوسط</span><span class="num up">${fmt(p.targets.mid.price)} ج · ${pct(p.targets.mid.upsidePct)}</span></div>
          <div class="lvl muted" style="font-size:11.5px"><span>${esc(p.targets.mid.basis)}</span><span>${esc(p.targets.mid.horizon.ar)} · ع/م ${p.targets.mid.riskReward}</span></div>` : ''}
        ${p.targets.long?.price ? `<div class="lvl"><span>الهدف البعيد</span><span class="num up">${fmt(p.targets.long.price)} ج · ${pct(p.targets.long.upsidePct)}</span></div>
          <div class="lvl muted" style="font-size:11.5px"><span>${esc(p.targets.long.basis)}</span><span>${esc(p.targets.long.horizon.ar)}</span></div>
          ${p.targets.long.caveat ? `<div class="muted" style="font-size:11px;margin-top:2px">${esc(p.targets.long.caveat)}</div>` : ''}`
            : `<div class="lvl muted"><span>الهدف البعيد</span><span>${esc(p.targets.long?.note ?? '—')}</span></div>`}
      </div>
      <div class="row" style="align-items:flex-start;gap:18px;margin-top:12px">
        <div style="flex:1;min-width:200px"><div class="card-title" style="font-size:13px">الدعوم</div>
          ${s.levels.supports.slice(0, 4).map((l) => `<div class="lvl"><span class="num">${fmt(l.price)}</span><span class="muted">${l.distancePct}% · قوة ${l.strength}</span></div>`).join('') || '<div class="muted">مفيش</div>'}</div>
        <div style="flex:1;min-width:200px"><div class="card-title" style="font-size:13px">المقاومات</div>
          ${s.levels.resistances.slice(0, 4).map((l) => `<div class="lvl"><span class="num">${fmt(l.price)}</span><span class="muted">+${l.distancePct}% · قوة ${l.strength}</span></div>`).join('') || '<div class="muted">مساحة مفتوحة</div>'}</div>
      </div>
      <div style="margin-top:12px">
        ${t.reasons.bullish.length ? `<div class="card-title up" style="font-size:13px">مؤيد</div><ul class="bullets">${t.reasons.bullish.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${t.reasons.bearish.length ? `<div class="card-title down" style="font-size:13px;margin-top:8px">معارض</div><ul class="bullets">${t.reasons.bearish.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      </div>`;
        $('#x').onclick = close;
      } catch (e) {
        $('#modal').innerHTML = `<button class="close" id="x">×</button><div class="empty">${esc(e.message)}</div>`;
        $('#x').onclick = close;
      }
    }
    $('#overlay').onclick = (e) => { if (e.target.id === 'overlay') $('#overlay').classList.remove('show'); };

    async function boot() {
      try {
        const { user } = await api('/api/auth/me');
        if (user) await enterApp(user);
      } catch (error) { $('#auth-error').textContent = error.message; }
    }
    await boot();
  </script>
</body>

</html>
