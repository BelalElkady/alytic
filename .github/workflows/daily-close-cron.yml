name: Record daily close

on:
  # Targets 14:30 Cairo time. GitHub Actions cron is UTC-only and Cairo
  # alternates between EET (UTC+2, → 12:30 UTC) and EEST (UTC+3, → 11:30 UTC)
  # across the year, so this fires at both candidate times; the endpoint
  # itself checks the real Cairo clock and no-ops on whichever run is wrong
  # for the current season — see /api/cron/daily-close in server.js.
  schedule:
    - cron: '30 11 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch: {}

env:
  BACKEND_PORT: 3000

jobs:
  snapshot:
    name: Trigger daily close snapshot for every user
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Validate secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DAILY_CLOSE_CRON_SECRET: ${{ secrets.DAILY_CLOSE_CRON_SECRET }}
        run: |
          set -eu
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DAILY_CLOSE_CRON_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is empty or unavailable in the production environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # Calls the backend over the VPS's own loopback interface, the same way
      # blog-cron.yml does — the cron endpoint is never exposed on the public
      # internet, so this SSH hop is the trigger rather than a public HTTPS URL.
      - name: Request daily close snapshot over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          envs: DAILY_CLOSE_CRON_SECRET,BACKEND_PORT
          script: |
            curl --fail --silent --show-error --max-time 300 -X POST "http://127.0.0.1:$BACKEND_PORT/api/cron/daily-close" \
              -H "X-Cron-Secret: $DAILY_CLOSE_CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{}'
        env:
          DAILY_CLOSE_CRON_SECRET: ${{ secrets.DAILY_CLOSE_CRON_SECRET }}
