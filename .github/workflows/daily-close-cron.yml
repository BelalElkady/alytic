name: Record daily close

on:
  # Backup only: the backend records the close itself at 14:30 Cairo (see
  # startDailyCloseScheduler in server.js), because GitHub drops or delays
  # these scheduled runs by hours. A run here just overwrites today's entry
  # with the same closing prices.
  # A second, independently-hosted cron pinger also hits
  # /api/cron/daily-close's public URL directly (same X-Cron-Secret gate) —
  # this workflow has itself gone a full day without firing at all, so relying
  # on GitHub's schedule trigger alone for the backup isn't enough either.
  # Targets 14:30 Cairo time. GitHub Actions cron is UTC-only and Cairo
  # alternates between EET (UTC+2, → 12:30 UTC) and EEST (UTC+3, → 11:30 UTC)
  # across the year, so this fires at both candidate times; the endpoint
  # itself checks the real Cairo clock and no-ops on any run that lands before
  # the 14:30 close — see /api/cron/daily-close in server.js.
  # Sunday-Thursday only (EGX's trading week; every UTC time here is still the
  # same calendar day in Cairo). Bank holidays are skipped by the endpoint.
  # The two later runs are backups: GitHub silently dropped both 14:30 runs on
  # the first day this workflow existed, and a re-run the same day just
  # overwrites the entry with the same closing prices.
  schedule:
    - cron: '30 11 * * 0-4'
    - cron: '30 12 * * 0-4'
    - cron: '7 14 * * 0-4'
    - cron: '7 17 * * 0-4'
  # Started by hand (Actions tab → Run workflow), for a day the built-in
  # holiday list got wrong — Islamic holidays move with the moon sighting, so
  # the EGX can trade on a day the list calls closed. A manual run forces the
  # close past the holiday, weekend and 14:30 checks; the scheduled runs above
  # never do, so a real holiday still records nothing.
  workflow_dispatch:
    inputs:
      force:
        description: 'Record the close even if the calendar says today is a holiday or the session has not closed'
        type: boolean
        default: true

env:
  BACKEND_PORT: 3000
  # 'false' on a scheduled run, where there are no inputs.
  FORCE_CLOSE: ${{ inputs.force && 'true' || 'false' }}

jobs:
  snapshot:
    name: Trigger daily close snapshot for every user
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Validate secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DAILY_CLOSE_CRON_SECRET: ${{ secrets.DAILY_CLOSE_CRON_SECRET }}
        run: |
          set -eu
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DAILY_CLOSE_CRON_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is empty or unavailable in the production environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # Calls the backend over the VPS's own loopback interface — the cron endpoint is never exposed on the public
      # internet, so this SSH hop is the trigger rather than a public HTTPS URL.
      - name: Request daily close snapshot over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          envs: DAILY_CLOSE_CRON_SECRET,BACKEND_PORT,FORCE_CLOSE
          script: |
            curl --fail --silent --show-error --max-time 300 -X POST "http://127.0.0.1:$BACKEND_PORT/api/cron/daily-close" \
              -H "X-Cron-Secret: $DAILY_CLOSE_CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"force\": $FORCE_CLOSE}"
        env:
          DAILY_CLOSE_CRON_SECRET: ${{ secrets.DAILY_CLOSE_CRON_SECRET }}
