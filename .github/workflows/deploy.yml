name: Build and Deploy Alytic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 20
  DEPLOY_PATH: /opt/alytic
  BACKEND_PORT: 3000
  FRONTEND_PORT: 8080

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend JavaScript
        shell: bash
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Report frontend lint issues
        working-directory: frontend
        run: bun run lint
        continue-on-error: true

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Package release
        shell: bash
        run: |
          set -eu
          mkdir -p deploy
          printf '%s\n' "$GITHUB_SHA" > deploy/COMMIT
          tar -czf deploy/alytic-release.tar.gz \
            deploy/COMMIT \
            backend/package.json \
            backend/package-lock.json \
            backend/src \
            backend/data/reference \
            frontend/.output

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: alytic-deployment
          path: deploy/alytic-release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: alytic-deployment
          path: deploy

      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -eu
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is empty or unavailable in the production environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Copy bundle to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: deploy/alytic-release.tar.gz
          target: /tmp
          overwrite: true

      - name: Install runtime dependencies and restart services
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          BACKEND_PORT: ${{ env.BACKEND_PORT }}
          FRONTEND_PORT: ${{ env.FRONTEND_PORT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,BACKEND_PORT,FRONTEND_PORT
          script: |
            set -eu
            RELEASE_ARCHIVE="$(find /tmp -type f -name 'alytic-release.tar.gz' -printf '%T@ %p\n' 2>/dev/null | sort -nr | awk 'NR==1 {sub(/^[^ ]+ /, ""); print}')"
            if [ -z "$RELEASE_ARCHIVE" ]; then
              echo "Release archive was not found under /tmp"
              exit 1
            fi
            rm -rf /tmp/alytic-release
            mkdir -p /tmp/alytic-release
            tar -xzf "$RELEASE_ARCHIVE" -C /tmp/alytic-release
            mkdir -p "$DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH/backend" "$DEPLOY_PATH/frontend"
            rm -rf "$DEPLOY_PATH/backend/src" "$DEPLOY_PATH/frontend/.output"
            cp "$(find /tmp/alytic-release -name COMMIT -type f -print -quit)" "$DEPLOY_PATH/COMMIT"
            cp -a /tmp/alytic-release/backend/src "$DEPLOY_PATH/backend/"
            # Must pre-exist: on a first deploy, `backend/data/` hasn't been
            # created by the running server yet, and `cp -a ... data/` into a
            # missing directory renames `reference` itself into `data` instead
            # of nesting it underneath.
            mkdir -p "$DEPLOY_PATH/backend/data"
            cp -a /tmp/alytic-release/backend/data/reference "$DEPLOY_PATH/backend/data/"
            cp /tmp/alytic-release/backend/package.json /tmp/alytic-release/backend/package-lock.json "$DEPLOY_PATH/backend/"
            cp -a /tmp/alytic-release/frontend/.output "$DEPLOY_PATH/frontend/"
            echo "Deployed commit: $(cat "$DEPLOY_PATH/COMMIT")"
            cd "$DEPLOY_PATH"
            npm ci --omit=dev --prefix backend

            # This box supervises Alytic with systemd (alytic-backend.service /
            # alytic-frontend.service — both `enabled`, Restart=on-failure, with
            # their own PORT/ALYTIC_API_URL already set). That predates this
            # pipeline. An earlier version of this workflow additionally started
            # PM2-managed processes of the same name on the same ports; since
            # systemd already holds :$BACKEND_PORT/:$FRONTEND_PORT, those never
            # won the bind and just crash-looped (alytic-backend under PM2 hit
            # 111 restarts). Remove that leftover duplicate and defer entirely
            # to systemd, which is the real supervisor here.
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete alytic-backend alytic-frontend >/dev/null 2>&1 || true
              pm2 save --force >/dev/null 2>&1 || true
            fi

            systemctl restart alytic-backend.service
            systemctl restart alytic-frontend.service
            sleep 2
            curl --fail --silent --show-error "http://127.0.0.1:$BACKEND_PORT/api/health" >/dev/null
            curl --fail --silent --show-error "http://127.0.0.1:$FRONTEND_PORT/" >/dev/null
