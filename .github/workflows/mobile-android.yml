name: Mobile — Android

on:
  push:
    branches: [main-android]
    paths: ["frontend/**", "backend/src/**", ".github/workflows/mobile-android.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release AAB (needs the signing secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      MOBILE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21   # Capacitor 8 compiles with Java 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Web tests
        run: bun run test

      - name: Web production build (unchanged SSR site)
        run: bun run build

      - name: Mobile web build (+ secret scan of the bundle)
        run: bun run build:mobile

      - name: Capacitor sync
        run: npx cap sync android

      # Optional: Firebase client config (public by design, but kept out of git). Push only works when present.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 not set — building without push configuration"
          fi

      - name: Lint, unit tests, debug build
        working-directory: frontend/android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: egxpert-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Signed release bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload release bundle + R8 mapping
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: egxpert-release-aab
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
