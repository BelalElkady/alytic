name: Database backup

on:
  # 02:30 Cairo in winter (UTC+2), 03:30 in summer (UTC+3): far from the EGX
  # session and the 14:30 daily close. GitHub may delay scheduled runs.
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two backups racing each other would fight over the same schema.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Copy production into the backup project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -eu
          missing=0
          for name in PROD_DATABASE_URL BACKUP_DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is empty or missing"
              missing=1
            fi
          done
          exit "$missing"

      - uses: ./.github/actions/setup-pg17

      - name: Back up production
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DUMP_OUT: ${{ runner.temp }}/db.sql.gz
        run: bash scripts/db-backup.sh

      # The schema copy above only ever holds last night's state. These dated,
      # encrypted dumps are what lets you go back further. The dump holds real
      # emails and password hashes, so it is never uploaded unencrypted.
      - name: Encrypt the dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -eu
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::error::GitHub secret BACKUP_ENCRYPTION_KEY is missing; the schema copy succeeded, but no dated dump was kept."
            exit 1
          fi
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$RUNNER_TEMP/db.sql.gz.gpg" "$RUNNER_TEMP/db.sql.gz"
          rm -f "$RUNNER_TEMP/db.sql.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: db-dump
          path: ${{ runner.temp }}/db.sql.gz.gpg
          retention-days: 7
          if-no-files-found: error

  vps-config:
    name: Back up VPS config and .env
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Fetch config from the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::GitHub secret $name is missing"; exit 1; fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Everything on the box that is not in git and would be needed to
          # rebuild it. Missing paths are skipped, not fatal; the listing
          # below shows what was actually captured (names only).
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd / && tar czf - --ignore-failed-read \
               opt/alytic/backend/.env opt/alytic/frontend/.env opt/alytic/COMMIT \
               etc/nginx/sites-available etc/nginx/conf.d/egxpert-limits.conf etc/nginx/snippets/egxpert-security.conf \
               etc/systemd/system/alytic-backend.service etc/systemd/system/alytic-frontend.service \
               2>/dev/null || true' > "$RUNNER_TEMP/vps-config.tar.gz"
          rm -f ~/.ssh/deploy_key
          # List to a file, not a pipe: grep -q exits on the first match, tar
          # then dies on SIGPIPE, and pipefail turns that into a false failure.
          tar tzf "$RUNNER_TEMP/vps-config.tar.gz" > "$RUNNER_TEMP/vps-config.list"
          echo "Captured:"
          cat "$RUNNER_TEMP/vps-config.list"
          if ! grep -qx 'opt/alytic/backend/.env' "$RUNNER_TEMP/vps-config.list"; then
            echo "::error::backend .env was not captured (missing, or not readable by $DEPLOY_USER)."
            exit 1
          fi

      - name: Encrypt
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -eu
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::error::GitHub secret BACKUP_ENCRYPTION_KEY is missing"
            exit 1
          fi
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$RUNNER_TEMP/vps-config.tar.gz.gpg" "$RUNNER_TEMP/vps-config.tar.gz"
          rm -f "$RUNNER_TEMP/vps-config.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: vps-config
          path: ${{ runner.temp }}/vps-config.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
