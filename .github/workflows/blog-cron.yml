name: Generate blog post

on:
  schedule:
    - cron: '0 6 * * *' # ~09:00 Africa/Cairo
  workflow_dispatch: {}

env:
  BACKEND_PORT: 3000

jobs:
  generate:
    name: Trigger daily draft batch generation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BLOG_CRON_SECRET: ${{ secrets.BLOG_CRON_SECRET }}
        run: |
          set -eu
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY BLOG_CRON_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is empty or unavailable in the production environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # Calls the backend over the VPS's own loopback interface, the same way
      # deploy.yml's post-deploy health check does — the cron endpoint is
      # never exposed on the public internet, so this SSH hop is the trigger
      # rather than a public HTTPS URL. The endpoint kicks off the ten-article
      # batch in the background and responds immediately, so this call
      # returns fast even though the batch itself takes several minutes.
      - name: Request daily blog batch generation over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: BLOG_CRON_SECRET,BACKEND_PORT
          script: |
            curl --fail --silent --show-error -X POST "http://127.0.0.1:$BACKEND_PORT/api/cron/blog-generate" \
              -H "X-Cron-Secret: $BLOG_CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{}'
        env:
          BLOG_CRON_SECRET: ${{ secrets.BLOG_CRON_SECRET }}
