name: Tests

# Every suite runs against the test Supabase project (qfxuejkbnrdszycqxvdx,
# `public` schema), never production, and with no AI or email key: the
# shared helper backend/test/helpers/test-database.js refuses production and
# blanks OPENROUTER_API_KEY / ANTHROPIC_API_KEY / RESEND_API_KEY, and this
# workflow never passes those secrets in the first place.
on:
  pull_request:
  workflow_dispatch:
  # deploy.yml calls this and only deploys when it passes.
  workflow_call:
    inputs:
      e2e:
        description: Also run the Playwright suite
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  TEST_SUPABASE_URL: https://qfxuejkbnrdszycqxvdx.supabase.co
  OPENROUTER_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  RESEND_API_KEY: ''

jobs:
  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: bun run test

  # Everything that touches the shared test database runs in this one job,
  # and only one such job runs at a time across every branch and the deploy:
  # re-applying the schema locks tables, so a second run's tests would time
  # out waiting on it. (Accounts are already per run, see TEST_RUN_ID in
  # backend/test/helpers/test-database.js.) GitHub keeps one run waiting per
  # group; if a third arrives the waiting one is cancelled, so rerun it.
  database:
    name: Database suites (schema, backend, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Playwright's image already has Chromium and the system libraries it
    # needs, so E2E no longer waits on Ubuntu's package mirrors for them (one
    # run spent 10 minutes there). Keep the tag on the @playwright/test version
    # in package-lock.json; if they drift, the install step below fetches the
    # matching browser. --ipc=host: Chromium runs out of shared memory without it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    concurrency:
      group: test-database
      cancel-in-progress: false
    env:
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      # On by default; a caller can pass e2e: false to skip it.
      # Compared as text: in expressions null == false, so `inputs.e2e != false`
      # would skip E2E whenever the input is absent.
      RUN_E2E: ${{ format('{0}', inputs.e2e) != 'false' }}
    steps:
      - uses: actions/checkout@v4

      # The image has no psql (schema and cleanup steps) or unzip (setup-bun).
      - name: Install psql and unzip
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client unzip

      # Both files are idempotent (`if not exists`, guarded alters), so
      # re-applying them every run keeps the test database on exactly the
      # schema this commit expects, and proves the files still apply cleanly.
      - name: Apply schema.sql and platform.sql
        env:
          TEST_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -eu
          if [ -z "$TEST_DATABASE_URL" ]; then echo "::error::GitHub secret BACKUP_DATABASE_URL is missing"; exit 1; fi
          psql "$TEST_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 --single-transaction -f backend/supabase/schema.sql -f backend/supabase/platform.sql
          # Make the API see new tables and columns straight away.
          psql "$TEST_DATABASE_URL" -X -q -c "notify pgrst, 'reload schema'"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - uses: oven-sh/setup-bun@v2
        if: env.RUN_E2E == 'true'

      - name: Install frontend and root dependencies
        if: env.RUN_E2E == 'true'
        run: |
          (cd frontend && bun install --frozen-lockfile)
          npm ci

      # A no-op when the image matches package-lock.json; otherwise downloads
      # the right Chromium (the image's system libraries still cover it).
      - name: Install Playwright browsers
        if: env.RUN_E2E == 'true'
        run: npx playwright install chromium

      - name: Run E2E tests
        if: env.RUN_E2E == 'true'
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7

      # Nothing a test wrote outlives the run: every table in the test
      # project's public schema and every storage bucket is emptied, then the
      # schema files restore the seeded 'local' dev account. always() runs it
      # after a failure or a cancelled run too. Only one database job runs at
      # a time (concurrency above), so no other run is using the data.
      - name: Delete all test data
        if: always()
        env:
          TEST_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -eu
          case "$TEST_DATABASE_URL" in
            *xssjwnevhbpcdmtbatiy*) echo "::error::refusing to wipe: this is the production project"; exit 1 ;;
            *qfxuejkbnrdszycqxvdx*) ;;
            *) echo "::error::refusing to wipe: not the test project"; exit 1 ;;
          esac
          if [ -d backend/node_modules ]; then
            # No TEST_RUN_ID here: removes every @test.local account and empties storage.
            (cd backend && TEST_RUN_ID= node scripts/cleanup-test-data.js)
          else
            echo "::warning::backend dependencies were never installed, so storage was not emptied"
          fi
          psql "$TEST_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 --single-transaction -f scripts/wipe-test-database.sql -f backend/supabase/schema.sql -f backend/supabase/platform.sql
          psql "$TEST_DATABASE_URL" -X -q -c "notify pgrst, 'reload schema'"
          left=$(psql "$TEST_DATABASE_URL" -X -At -c "select (select count(*) from public.users where id <> 'local') + (select count(*) from public.recommendations) + (select count(*) from storage.objects)")
          echo "rows and files left after cleanup: $left"
          if [ "$left" != "0" ]; then echo "::error::test data is still in the test project"; exit 1; fi
