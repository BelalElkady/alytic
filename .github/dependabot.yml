version: 2

# Weekly update PRs, so security fixes arrive as small reviewable changes
# instead of a pile-up. Security advisories open their own PRs immediately,
# regardless of this schedule, once "Dependabot security updates" is enabled in
# the repository's Settings → Code security.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Pins in the workflows, notably the third-party SSH/SCP deploy actions that
  # hold the server key.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
